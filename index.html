  // 2. ???????????????? (??/??/??????)
  async function loadHKO() {
    try {
      const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
      if (res.ok) {
        const data = await res.json();
        const hko = data.temperature?.data?.find(t => t.place === '?????') || data.temperature?.data?.[0];
        if (hko) document.getElementById('temp').innerText = hko.value;
        if (data.humidity?.data?.[0]) document.getElementById('humi').innerText = data.humidity.data[0].value + '%';
        if (data.uvindex?.data?.[0]) {
          document.getElementById('uv').innerText = data.uvindex.data[0].value;
        } else {
          document.getElementById('uv').innerText = '0';
        }
        const isRain = data.rainfall?.data?.some(r => r.max > 0);
        document.getElementById('cond').innerText = isRain ? '???' : '????';
      }
    } catch (e) {
      console.warn('HKO weather API fallback:', e);
    }

    try {
      const wRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
      if (wRes.ok) {
        const wData = await wRes.json();
        const keys = Object.keys(wData);
        if (keys.length > 0) {
          const WARN_NAMES = {
            'TC1': '??????',
            'TC3': '??????',
            'TC8NE': '??????',
            'TC8SE': '??????',
            'TC8NW': '??????',
            'TC8SW': '??????',
            'TC8': '??????',
            'TC9': '??????',
            'TC10': '??????',
            'WRAINA': '??????',
            'WRAINR': '??????',
            'WRAINB': '??????',
            'WTS': '????',
            'WMS': '???????',
            'WFIREY': '??????',
            'WFIRER': '??????',
            'WHOT': '??????',
            'WCOLD': '??????',
            'WL': '??????',
            'WFNL': '??????',
            'WFROST': '????',
            'WTMW': '????'
          };

          const priority = ['WTCSGNL', 'WRAIN', 'WTS', 'WTMW', 'WL', 'WMS', 'WHOT', 'WCOLD', 'WFIRE', 'WFROST'];
          keys.sort((a, b) => {
            const idxA = priority.indexOf(a) === -1 ? 99 : priority.indexOf(a);
            const idxB = priority.indexOf(b) === -1 ? 99 : priority.indexOf(b);
            return idxA - idxB;
          });

          const hasThunderstorm = keys.some(k => k === 'WTS' || wData[k]?.code === 'WTS');

          const otherWarnings = keys
            .filter(k => k !== 'WTS' && wData[k]?.code !== 'WTS')
            .map(k => {
              const item = wData[k];
              const code = item.code || '';
              return WARN_NAMES[code] || item.type || item.name || '??????';
            });

          const warnEl = document.getElementById('warnText');
          const boltIcon = '<i class="fa-solid fa-bolt text-[9px] text-white"></i>';

          if (otherWarnings.length > 0) {
            const textPart = otherWarnings.slice(0, 2).join(' · ');
            warnEl.innerHTML = hasThunderstorm ? `${textPart} ${boltIcon}` : textPart;
          } else if (hasThunderstorm) {
            warnEl.innerHTML = `${boltIcon} ????`;
          } else {
            warnEl.innerText = '??????? (??)';
          }
        } else {
          document.getElementById('warnText').innerText = '??????? (??)';
        }
      }
    } catch (e) {
      document.getElementById('warnText').innerText = '??????? (??)';
    }
  }

  // 3.5 ?????????????? (?????? ? ??? ? ??????)
  function loadTideTimes() {
    const now = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    const spot = SURF_SPOTS[currentSpotIdx];
    
    // ????????????????? (???????? 12.4206 ??)
    const refNewMoon = new Date('2024-01-11T11:57:00Z');
    const diffDays = (now - refNewMoon) / (1000 * 60 * 60 * 24);
    const moonAge = (diffDays % 29.53058867 + 29.53058867) % 29.53058867;
    
    // ??????????? vs ???? vs ????????????
    const period = 12.4206;
    const baseHigh = ((moonAge * 0.84 + 8.6 + spot.tideOffsetHours) % period + period) % period;
    
    // ???? 00:00 ? 24:00 ????????? (High Tides)
    const highCandidates = [baseHigh - period, baseHigh, baseHigh + period, baseHigh + period * 2];
    const highTides = highCandidates.filter(t => t >= 0 && t < 24).sort((a, b) => a - b);
    
    // ??????? 6.21 ?? (Low Tides)
    const baseLow = baseHigh + (period / 2);
    const lowCandidates = [baseLow - period * 2, baseLow - period, baseLow, baseLow + period, baseLow + period * 2];
    const lowTides = lowCandidates.filter(t => t >= 0 && t < 24).sort((a, b) => a - b);
    
    const formatTime = (hFloat) => {
      const h = Math.floor(hFloat);
      const m = Math.floor((hFloat % 1) * 60);
      return `${pad(h % 24)}:${pad(m % 60)}`;
    };
    
    // ???????????????????
    const highStr = highTides.map(formatTime).join(' ');
    const lowStr = lowTides.map(formatTime).join(' ');
    
    const tideEl = document.getElementById('tideTimes');
    if (tideEl) {
      tideEl.innerHTML = `<span class="block whitespace-nowrap">?${highStr}</span><span class="block whitespace-nowrap">?${lowStr}</span>`;
      tideEl.title = `??????????? ${highTides.map(formatTime).join(', ')} | ?? ${lowTides.map(formatTime).join(', ')}`;
    }
  }

  // 4. ??????????? 5 ??????????????
  async function loadSwellStats() {
    const spot = SURF_SPOTS[currentSpotIdx];
    const statsGrid = document.getElementById('cs_stats');
    
    try {
      const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lon}&current=wave_height,swell_wave_height,swell_wave_direction,swell_wave_period&hourly=wave_height,swell_wave_height,swell_wave_period&forecast_days=5&timezone=Asia%2FHong_Kong`;
      const res = await fetch(url);
      
      if (res.ok) {
        const data = await res.json();
        
        // ????????
        const curSwell = data.current?.swell_wave_height ?? 0.8;
        const curPeriod = Math.round(data.current?.swell_wave_period ?? 7);
        const curDir = data.current?.swell_wave_direction ?? 180;
        const curTotal = data.current?.wave_height ?? 1.0;

        document.getElementById('cs_now').innerText = curSwell.toFixed(1);
        document.getElementById('cs_now_ft').innerText = `(${(curSwell * 3.28).toFixed(1)}?)`;
        document.getElementById('cs_pd').innerText = curPeriod + 's';
        document.getElementById('cs_total').innerText = curTotal.toFixed(1) + 'm';
        
        const dirs = ['? (N)', '?? (NE)', '? (E)', '?? (SE)', '? (S)', '?? (SW)', '? (W)', '?? (NW)'];
        document.getElementById('cs_dr').innerText = dirs[Math.round(curDir / 45) % 8];

        // ?? 5 ?????
        statsGrid.innerHTML = '';
        const hourlySwell = data.hourly?.swell_wave_height || [];
        const hourlyPd = data.hourly?.swell_wave_period || [];
        const weekDays = ['?', '?', '?', '?', '?', '?', '?'];
        const baseDate = new Date();

        for (let day = 0; day < 5; day++) {
          const targetDate = new Date(baseDate);
          targetDate.setDate(baseDate.getDate() + day);
          const m = targetDate.getMonth() + 1;
          const d = targetDate.getDate();
          const wk = weekDays[targetDate.getDay()];
          const dayPrefix = day === 0 ? '?' : (day === 1 ? '?' : `D${day + 1}`);

          const startIdx = day * 24;
          const endIdx = (day + 1) * 24;
          const dayHeights = hourlySwell.slice(startIdx, endIdx);
          const dayPds = hourlyPd.slice(startIdx, endIdx);

          let avg = '0.8', min = '0.6', max = '1.0', avgPd = 7;
          if (dayHeights.length > 0) {
            avg = (dayHeights.reduce((a, b) => a + b, 0) / dayHeights.length).toFixed(1);
            min = Math.min(...dayHeights).toFixed(1);
            max = Math.max(...dayHeights).toFixed(1);
          }
          if (dayPds.length > 0) {
            avgPd = Math.round(dayPds.reduce((a, b) => a + b, 0) / dayPds.length);
          }

          const isToday = (day === 0);
          /* ????? 1.5 ???????????????????????????? */
          const isFullSwell = parseFloat(avg) >= 1.5;
          const waveVisual = isFullSwell
            ? `<i class="fa-solid fa-water text-xs sm:text-sm leading-none" title="???? (?1.5m)"></i>`
            : '';

          statsGrid.innerHTML += `
            <div class="stats-cell ${isToday ? 'active-day' : ''}">
              <div class="text-[7.5px] font-black tracking-tight leading-none pt-0.5">
                <div>${dayPrefix} ${m}/${d}</div>
                <div class="text-[6.5px] font-bold opacity-85 mt-0.5">??${wk}</div>
              </div>
              <div class="w-full flex items-center justify-center h-2.5 my-0 px-0.5">
                ${waveVisual}
              </div>
              <div class="font-mono text-[11px] font-black leading-none">
                ${avg}<span class="text-[6.5px] font-normal">m</span>
              </div>
              <div class="text-[6.5px] font-mono opacity-80 leading-none mt-0.5">
                ${min}-${max}
              </div>
              <div class="text-[6.5px] font-bold border-t ${isToday ? 'border-white' : 'border-black'} border-dotted w-full pt-0.5 mt-0.5 leading-none">
                ${avgPd}s
              </div>
            </div>`;
        }
        return;
      }
    } catch (e) {
      console.warn('Swell stats fallback for spot:', spot.name, e);
    }
    
    renderFallbackSwellStats();
  }

  function renderFallbackSwellStats() {
    const statsGrid = document.getElementById('cs_stats');
    statsGrid.innerHTML = '';
    
    const spot = SURF_SPOTS[currentSpotIdx];
    const isEastCoast = currentSpotIdx > 0;
    const baseAvg = isEastCoast ? '1.1' : '0.8';
    const weekDays = ['?', '?', '?', '?', '?', '?', '?'];
    const baseDate = new Date();

    const fallbackData = [
      { avg: baseAvg, min: '0.6', max: '1.2', pd: 7, active: true },
      { avg: isEastCoast ? '1.5' : '1.0', min: '0.8', max: '1.6', pd: 8, active: false },
      { avg: isEastCoast ? '1.6' : '1.2', min: '1.0', max: '1.8', pd: 9, active: false },
      { avg: '0.7', min: '0.5', max: '0.9', pd: 6, active: false },
      { avg: '0.6', min: '0.4', max: '0.8', pd: 6, active: false }
    ];

    fallbackData.forEach((item, day) => {
      const targetDate = new Date(baseDate);
      targetDate.setDate(baseDate.getDate() + day);
      const m = targetDate.getMonth() + 1;
      const d = targetDate.getDate();
      const wk = weekDays[targetDate.getDay()];
      const dayPrefix = day === 0 ? '?' : (day === 1 ? '?' : `D${day + 1}`);

      const isFullSwell = parseFloat(item.avg) >= 1.5;
      const waveVisual = isFullSwell
        ? `<i class="fa-solid fa-water text-xs sm:text-sm leading-none" title="???? (?1.5m)"></i>`
        : '';

      statsGrid.innerHTML += `
        <div class="stats-cell ${item.active ? 'active-day' : ''}">
          <div class="text-[7.5px] font-black tracking-tight leading-none pt-0.5">
            <div>${dayPrefix} ${m}/${d}</div>
            <div class="text-[6.5px] font-bold opacity-85 mt-0.5">??${wk}</div>
          </div>
          <div class="w-full flex items-center justify-center h-2.5 my-0 px-0.5">
            ${waveVisual}
          </div>
          <div class="font-mono text-[11px] font-black leading-none">${item.avg}<span class="text-[6.5px] font-normal">m</span></div>
          <div class="text-[6.5px] font-mono opacity-80 leading-none mt-0.5">${item.min}-${item.max}</div>
          <div class="text-[6.5px] font-bold border-t ${item.active ? 'border-white' : 'border-black'} border-dotted w-full pt-0.5 mt-0.5 leading-none">${item.pd}s</div>
        </div>`;
    });
  }

  // 5. ????????
  async function fetchAllData() {
    const icon = document.getElementById('syncIcon');
    icon.classList.add('fa-spin');
    
    await Promise.allSettled([
      loadHKO(),
      loadForecast(),
      loadSwellStats(),
      Promise.resolve(loadTideTimes())
    ]);
    
    const now = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    document.getElementById('lastUpdated').innerText = `UPDATED: ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    
    setTimeout(() => icon.classList.remove('fa-spin'), 500);
  }

  // 6. ?????????? 30 ?????????????????
  function triggerAutoInversion() {
    const wasInverted = document.body.classList.contains('inverted');
    
    if (!wasInverted) {
      document.body.classList.add('inverted');
    } else {
      document.body.classList.remove('inverted');
    }

    setTimeout(() => {
      if (!wasInverted) {
        document.body.classList.remove('inverted');
      } else {
        document.body.classList.add('inverted');
      }
    }, 1200);
  }

  // ???????????????????? 15 ??????
  window.addEventListener('DOMContentLoaded', () => {
    updateSpotUI();
    fetchAllData();
    setInterval(fetchAllData, 15 * 60 * 1000);
    
    // ? 30 ????????????????????
    setInterval(triggerAutoInversion, 30 * 60 * 1000);
  });
</script>
