<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <!-- 支援全螢幕瀏海屏，鎖定雙擊與視窗變形 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="香港與海外熱點即時第一湧浪浪況、5天深度趨勢統計與權威氣象局即時儀表板">
  <title>衝浪浪況 & 天氣儀表板 (Surf Dashboard)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&family=JetBrains+Mono:wght@700;900&display=swap');
    
    *, *::before, *::after { 
      box-sizing: border-box; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 全域流體排版與間距系統 (CSS Clamp) */
    :root {
      --space-page: clamp(3px, 0.8vh, 8px);
      --gap-main: clamp(2px, 0.5vh, 5px);
      --gap-grid: clamp(2px, 0.6vw, 6px);
      --border-thick: clamp(1.5px, 0.22vmin, 2.5px);

      /* 字體流體 Clamp 系統：確保跨設備字體不變形、不縮成郵票亦不爆版 */
      --fs-clock: clamp(2.8rem, 7vmin + 1rem, 5.0rem);
      --fs-ampm: clamp(0.95rem, 2vmin, 1.4rem);
      --fs-date: clamp(0.88rem, 1.8vmin, 1.25rem);
      --fs-swell-main: clamp(3.4rem, 8.5vmin + 1rem, 5.8rem);
      --fs-unit: clamp(1.1rem, 2.2vmin, 1.6rem);
      --fs-subtitle: clamp(0.85rem, 1.8vmin, 1.2rem);
      --fs-label: clamp(0.78rem, 1.6vmin, 1.12rem);
      --fs-value: clamp(1.05rem, 2.2vmin, 1.55rem);
      --fs-tide: clamp(0.78rem, 1.5vmin, 1.15rem);
      --fs-forecast-day: clamp(0.85rem, 1.7vmin, 1.2rem);
      --fs-footer: clamp(0.75rem, 1.5vmin, 1.05rem);
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #ffffff; 
      color: #000000;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang SC", "Microsoft JhengHei", "微軟正黑體", sans-serif;
      user-select: none;
      touch-action: pan-y pinch-zoom;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow: hidden;
    }

    .font-mono { 
      font-family: 'JetBrains Mono', Consolas, Monaco, "Courier New", monospace; 
    }

    .screen-container {
      width: 100%;
      max-width: clamp(360px, 96vw, 760px);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: clamp(3px, env(safe-area-inset-top, 4px), 8px) 
               clamp(5px, env(safe-area-inset-right, 8px), 14px) 
               clamp(3px, env(safe-area-inset-bottom, 4px), 8px) 
               clamp(5px, env(safe-area-inset-left, 8px), 14px);
      display: flex; 
      flex-direction: column;
      justify-content: space-between;
      gap: var(--gap-main);
      position: relative;
    }

    /* 墨水屏純黑高反差邊框 */
    .ink-b { border: var(--border-thick) solid #000000; }
    .ink-b-b { border-bottom: var(--border-thick) solid #000000; }
    .ink-b-r { border-right: var(--border-thick) solid #000000; }
    .ink-b-t { border-top: var(--border-thick) solid #000000; }
    .ink-b-l { border-left: var(--border-thick) solid #000000; }

    /* 反色模式支援 (Night / Inverted E-Ink) */
    .inverted { background-color: #000000 !important; color: #ffffff !important; }
    .inverted .ink-b, .inverted .ink-b-b, .inverted .ink-b-r, .inverted .ink-b-t, .inverted .ink-b-l { border-color: #ffffff !important; }
    .inverted .bg-white { background-color: #000000 !important; color: #ffffff !important; }
    .inverted .bg-black { background-color: #ffffff !important; color: #000000 !important; }
    .inverted .text-black { color: #ffffff !important; }
    .inverted .text-white { color: #000000 !important; }
    .inverted .border-black { border-color: #ffffff !important; }
    .inverted .border-white { border-color: #000000 !important; }
    .inverted .stats-cell { background-color: #111111 !important; color: #ffffff !important; }
    .inverted .stats-cell.active-day { background-color: #ffffff !important; color: #000000 !important; }
    .inverted .f-mini-cell { background-color: #111111 !important; color: #ffffff !important; }
    .inverted .f-mini-cell.active-f { background-color: #ffffff !important; color: #000000 !important; }
    .inverted .spot-dot.active { background-color: #ffffff !important; }
    .inverted .spot-dot { border-color: #ffffff !important; }
    .inverted .warn-link { background-color: #ffffff !important; color: #000000 !important; border-color: #ffffff !important; }

    /* 5 天第一湧浪深度趨勢統計網格 (去線留白版) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: var(--gap-grid);
      width: 100%;
    }

    .stats-cell {
      background-color: #f7f7f7;
      border-radius: 4px;
      padding: clamp(2px, 0.4vh, 5px) clamp(2px, 0.3vw, 4px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      min-width: 0;
    }

    .stats-cell.active-day {
      background-color: #000000;
      color: #ffffff;
    }

    /* 5 天天文台/氣象局微型預報條 (去線留白版) */
    .f-mini-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: var(--gap-grid);
      width: 100%;
    }

    .f-mini-cell {
      background-color: #f7f7f7;
      border-radius: 4px;
      padding: clamp(2px, 0.4vh, 5px) 2px;
      text-align: center;
      min-width: 0;
      line-height: 1.2;
    }

    .f-mini-cell.active-f {
      background-color: #000000;
      color: #ffffff;
      font-weight: 900;
    }

    /* 據點指示點 */
    .spot-dot {
      width: clamp(5px, 0.8vmin, 8px);
      height: clamp(5px, 0.8vmin, 8px);
      border: var(--border-thick) solid #000000;
      border-radius: 9999px;
      display: inline-block;
      cursor: pointer;
    }
    .spot-dot.active {
      background-color: #000000;
    }

    /* 海外天文台超連結樣式 */
    .warn-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .warn-link:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    /* 動態字體綁定 class */
    .font-fluid-clock { font-size: var(--fs-clock); line-height: 0.9; }
    .font-fluid-ampm { font-size: var(--fs-ampm); }
    .font-fluid-date { font-size: var(--fs-date); }
    .font-fluid-swell { font-size: var(--fs-swell-main); line-height: 0.9; }
    .font-fluid-unit { font-size: var(--fs-unit); }
    .font-fluid-subtitle { font-size: var(--fs-subtitle); }
    .font-fluid-label { font-size: var(--fs-label); }
    .font-fluid-value { font-size: var(--fs-value); }
    .font-fluid-tide { font-size: var(--fs-tide); }
    .font-fluid-forecast { font-size: var(--fs-forecast-day); }
    .font-fluid-footer { font-size: var(--fs-footer); }
  </style>
</head>
<body>

<div class="screen-container" id="mainContainer">

  <!-- 1. 頂部抬頭區：據點導航、警告標籤與 12 小時 AM/PM 流體大時鐘 (時:分) -->
  <header class="flex justify-between items-center shrink-0 pt-0.5">
    <div class="flex flex-col gap-1 min-w-0 pr-2">
      <div class="flex items-center gap-1.5 flex-wrap">
        <!-- 點擊或滑動切換的據點導航 -->
        <div class="inline-flex items-center bg-black text-white px-2 py-0.5 font-black tracking-wider select-none shrink-0 font-fluid-label rounded-sm">
          <button onclick="prevSpot()" class="px-1 font-black hover:opacity-75 cursor-pointer" title="上一個浪點" aria-label="上一個浪點">◀</button>
          <span class="mx-1 cursor-pointer font-black" id="spotNavTitle" onclick="nextSpot()">HK SURF</span>
          <button onclick="nextSpot()" class="px-1 font-black hover:opacity-75 cursor-pointer" title="下一個浪點" aria-label="下一個浪點">▶</button>
        </div>
        
        <!-- 6 個浪點的位置圓點指示器 -->
        <div class="flex items-center gap-1 px-0.5 shrink-0 flex-wrap max-w-[120px]" id="spotDots">
          <!-- 由 JavaScript 動態生成 6 個圓點 -->
        </div>

        <button onclick="toggleTheme()" title="反色模式切換" aria-label="反色切換" class="ink-b px-1.5 py-0.5 font-black font-fluid-label active:bg-black active:text-white cursor-pointer shrink-0 rounded-sm"><i class="fa-solid fa-circle-half-stroke"></i></button>
        <button onclick="fetchAllData()" title="手動刷新數據" aria-label="更新數據" class="ink-b px-1.5 py-0.5 font-black font-fluid-label active:bg-black active:text-white cursor-pointer shrink-0 rounded-sm"><i id="syncIcon" class="fa-solid fa-rotate"></i></button>
      </div>
      
      <!-- 特別天氣警告標籤容器 (香港直接顯示，海外轉為官方外鏈按鈕) -->
      <div id="warnContainer" class="max-w-[360px] truncate">
        <!-- 由 JavaScript 動態渲染常規 Badge 或超連結 Anchor -->
      </div>
    </div>
    
    <!-- 右側日期與 12 小時制 AM/PM 大時鐘 -->
    <div class="text-right leading-none flex flex-col justify-center items-end shrink-0 pl-1">
      <div class="flex items-baseline justify-end gap-1">
        <span id="ampm" class="font-mono font-fluid-ampm font-black tracking-tight">AM</span>
        <span id="clock" class="font-mono font-fluid-clock font-black tracking-tighter">--:--</span>
      </div>
      <div class="font-fluid-date font-black mt-0.5 tracking-tight whitespace-nowrap">
        <span id="date">----/--/--</span>
        <span id="wkday" class="ml-1.5 border-b-2 border-black font-black">星期-</span>
      </div>
    </div>
  </header>

  <!-- 2. 實時氣候速報 (整合 P1：動態即時潮位狀態徽章) -->
  <section class="ink-b grid grid-cols-[0.85fr_1.1fr_0.85fr_0.75fr_2.7fr] text-center items-center py-1 bg-white shrink-0">
    <div class="ink-b-r px-0.5 min-w-0">
      <p class="font-fluid-label font-black uppercase">氣溫</p>
      <p class="font-mono font-fluid-value font-black mt-0.5 leading-none"><span id="temp">28</span>°</p>
    </div>
    <div class="ink-b-r px-0.5 min-w-0">
      <p class="font-fluid-label font-black uppercase">天氣</p>
      <p id="cond" class="font-fluid-value font-black leading-tight mt-0.5 truncate px-0.5">大致天晴</p>
    </div>
    <div class="ink-b-r px-0.5 min-w-0">
      <p class="font-fluid-label font-black uppercase">濕度</p>
      <p id="humi" class="font-mono font-fluid-value font-black mt-0.5 leading-none">78%</p>
    </div>
    <div class="ink-b-r px-0.5 min-w-0">
      <p class="font-fluid-label font-black uppercase">UV</p>
      <p id="uv" class="font-mono font-fluid-value font-black mt-0.5 leading-none">6</p>
    </div>
    <div class="px-1 min-w-0">
      <!-- P1: 標題整合當前即時潮況徽章 (例如「潮汐 · 漲潮中 ▲」) -->
      <div class="flex items-center justify-center gap-1 font-fluid-label font-black">
        <span class="uppercase">潮汐</span>
        <span id="tideNowBadge" class="bg-black text-white text-[0.74rem] px-1.5 py-0.2 font-black rounded-sm leading-none whitespace-nowrap">計算中</span>
      </div>
      <p id="tideTimes" class="font-mono font-fluid-tide font-black leading-tight mt-0.5 tracking-tight">
        <span class="block truncate">▲ --:--</span>
        <span class="block truncate">▼ --:--</span>
      </p>
    </div>
  </section>

  <!-- 3. 即時第一湧浪核心卡片 (整合 P2：浪向動態方位箭頭，無外框大氣設計) -->
  <section class="py-1 px-2 bg-white shrink-0 flex flex-col justify-center items-center min-h-0">
    <div class="w-full max-w-[92%] sm:max-w-[82%] mx-auto grid grid-cols-12 items-center gap-3 sm:gap-6">
      <!-- 左側：湧浪數值主區 -->
      <div class="col-span-7 flex flex-col items-center justify-center text-center h-full min-w-0 py-0.5">
        <div>
          <div id="spotTitle" class="font-fluid-subtitle font-black uppercase tracking-wider border-b-2 border-black inline-block mb-1 truncate max-w-full">
            下長沙即時第一湧浪
          </div>
        </div>
        <div class="flex items-baseline justify-center gap-1.5 my-auto flex-nowrap overflow-hidden">
          <span id="cs_now" class="font-mono font-fluid-swell font-black tracking-tighter">0.8</span>
          <span class="font-fluid-unit font-black">m</span>
          <span id="cs_now_ft" class="font-fluid-label font-mono font-black whitespace-nowrap ml-0.5 opacity-90">(2.6呎)</span>
        </div>
      </div>
      
      <!-- 右側：指標列表 (整合 P2 箭頭旋轉展示) -->
      <div class="col-span-5 pl-3 sm:pl-4 ink-b-l grid grid-rows-3 gap-y-1.5 h-full py-1 min-w-0 justify-center">
        <!-- 週期 -->
        <div class="grid grid-cols-[clamp(40px,6cqi,58px)_1fr] items-center gap-x-2 min-w-0">
          <span class="font-fluid-label font-black bg-black text-white py-0.5 text-center shrink-0 leading-tight rounded-sm">週期</span>
          <span id="cs_pd" class="font-mono font-fluid-value font-black text-right leading-none truncate">7s</span>
        </div>
        <!-- 浪向 (P2 旋轉箭頭) -->
        <div class="grid grid-cols-[clamp(40px,6cqi,58px)_1fr] items-center gap-x-2 min-w-0">
          <span class="font-fluid-label font-black bg-black text-white py-0.5 text-center shrink-0 leading-tight rounded-sm">浪向</span>
          <div class="flex items-center justify-end gap-1 min-w-0 leading-none">
            <i id="cs_dr_arrow" class="fa-solid fa-arrow-up text-xs sm:text-sm shrink-0 transition-transform duration-500" style="transform: rotate(180deg);" title="浪向波浪行進方向"></i>
            <span id="cs_dr" class="font-black font-fluid-label text-right truncate">南 (S)</span>
          </div>
        </div>
        <!-- 總浪 -->
        <div class="grid grid-cols-[clamp(40px,6cqi,58px)_1fr] items-center gap-x-2 min-w-0">
          <span class="font-fluid-label font-black bg-black text-white py-0.5 text-center shrink-0 leading-tight rounded-sm">總浪</span>
          <span id="cs_total" class="font-mono font-fluid-value font-black text-right leading-none truncate">1.0m</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. 未來 5 天第一湧浪深度趨勢統計 (整合 P5：去雜線純留白海報風) -->
  <section class="flex flex-col justify-center min-h-0 py-0.5 shrink-0">
    <div class="flex justify-between items-center ink-b-b pb-0.5 mb-1 shrink-0">
      <span class="font-fluid-label font-black tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-chart-simple text-[11px]"></i>
        <span>未來 5 天第一湧浪深度趨勢統計</span>
      </span>
      <span class="font-fluid-footer font-black opacity-85 inline-flex items-center gap-0.5 whitespace-nowrap">
        ≥1.5m 滿浪圖 <i class="fa-solid fa-water text-[10px]"></i>
      </span>
    </div>
    
    <!-- 5 天趨勢卡片網格 -->
    <div class="stats-grid" id="cs_stats">
      <div class="col-span-5 text-center py-2 font-mono font-bold text-xs">載入 5 天湧浪數據中...</div>
    </div>
  </section>

  <!-- 5. 未來 5 天微型預報條 (香港顯示 HKO，海外顯示當地國家氣象局 CWA / BMKG 預測) -->
  <section class="shrink-0">
    <div class="flex justify-between items-center mb-0.5">
      <span id="forecastTitle" class="font-fluid-label font-black tracking-wider">HKO 5-DAY FORECAST (香港天文台五日預測)</span>
    </div>
    <div class="f-mini-grid" id="f_mini">
      <!-- 由 JavaScript 動態生成 5 格微縮預報 -->
    </div>
  </section>

  <!-- 6. 熱點名稱、定位座標與更新時間戳 -->
  <footer class="flex justify-between items-center font-fluid-footer font-mono font-bold px-0.5 shrink-0 ink-b-t pt-1 pb-0.5">
    <span class="truncate max-w-[65%]" id="footerSpotDesc">熱點: 下長沙 (22.2312°N, 113.9472°E) · 香港天文台</span>
    <span id="lastUpdated" class="shrink-0 ml-1">UPDATED: --:--:--</span>
  </footer>

</div>

<script>
  // 0. 全球衝浪熱點配置（包含各國官方氣象主管機關之「即時警特報網站」直連連結）
  const SURF_SPOTS = [
    {
      id: 'cheung_sha',
      name: '下長沙',
      country: '香港',
      agency: 'HKO',
      agencyName: '香港天文台',
      badge: '下長沙 (HK)',
      lat: 22.2312,
      lon: 113.9472,
      tideStation: '石壁 / 芝麻灣',
      tideOffsetHours: 0,
      timezone: 'Asia/Hong_Kong',
      hasOfficialApi: true,
      officialWarningUrl: 'https://www.hko.gov.hk/tc/wxinfo/currwx/flw.htm'
    },
    {
      id: 'hk_big_wave_bay',
      name: '港島大浪灣',
      country: '香港',
      agency: 'HKO',
      agencyName: '香港天文台',
      badge: '港島大浪灣 (HK)',
      lat: 22.2472,
      lon: 114.2492,
      tideStation: '橫瀾島 / 鰂魚涌',
      tideOffsetHours: -0.5,
      timezone: 'Asia/Hong_Kong',
      hasOfficialApi: true,
      officialWarningUrl: 'https://www.hko.gov.hk/tc/wxinfo/currwx/flw.htm'
    },
    {
      id: 'sk_tai_long_wan',
      name: '西貢大浪灣',
      country: '香港',
      agency: 'HKO',
      agencyName: '香港天文台',
      badge: '西貢大浪灣 (HK)',
      lat: 22.4005,
      lon: 114.3752,
      tideStation: '塔門 / 橫瀾島',
      tideOffsetHours: -0.8,
      timezone: 'Asia/Hong_Kong',
      hasOfficialApi: true,
      officialWarningUrl: 'https://www.hko.gov.hk/tc/wxinfo/currwx/flw.htm'
    },
    {
      id: 'tw_wushi',
      name: '宜蘭烏石港',
      country: '台灣',
      agency: 'CWA',
      agencyName: '中央氣象署',
      badge: '宜蘭烏石港 (TW)',
      lat: 24.8710,
      lon: 121.8355,
      tideStation: '頭城 / 烏石港',
      tideOffsetHours: -0.3,
      timezone: 'Asia/Taipei',
      hasOfficialApi: false,
      // 交通部中央氣象署宜蘭頭城警特報官方頁面
      officialWarningUrl: 'https://www.cwa.gov.tw/V8/C/P/Warning/W26.html'
    },
    {
      id: 'bali_kuta',
      name: '峇里島 Kuta',
      country: '印尼',
      agency: 'BMKG',
      agencyName: '印尼氣象局',
      badge: 'Kuta Beach (ID)',
      lat: -8.7185,
      lon: 115.1686,
      tideStation: 'Benoa / Kuta',
      tideOffsetHours: 1.5,
      timezone: 'Asia/Makassar',
      hasOfficialApi: false,
      // BMKG 印尼氣象局峇里海峽與海域巨浪警報官方專頁
      officialWarningUrl: 'https://maritim.bmkg.go.id/cuaca/perairan/selat-bali-bagian-selatan'
    },
    {
      id: 'bali_uluwatu',
      name: '峇里 烏魯瓦圖',
      country: '印尼',
      agency: 'BMKG',
      agencyName: '印尼氣象局',
      badge: 'Uluwatu (ID)',
      lat: -8.8149,
      lon: 115.0884,
      tideStation: 'Padang Padang / Uluwatu',
      tideOffsetHours: 1.4,
      timezone: 'Asia/Makassar',
      hasOfficialApi: false,
      // BMKG 印尼氣象局峇里島全域極端天氣與海浪預警
      officialWarningUrl: 'https://bbmkg3.bmkg.go.id/prakiraan-cuaca-umum'
    }
  ];

  let currentSpotIdx = 0;

  function switchSpot(index) {
    if (index < 0) index = SURF_SPOTS.length - 1;
    if (index >= SURF_SPOTS.length) index = 0;
    currentSpotIdx = index;
    updateSpotUI();
    fetchAllData();
  }

  function nextSpot() { switchSpot(currentSpotIdx + 1); }
  function prevSpot() { switchSpot(currentSpotIdx - 1); }

  function updateSpotUI() {
    const spot = SURF_SPOTS[currentSpotIdx];
    const spotTitleEl = document.getElementById('spotTitle');
    if (spotTitleEl) spotTitleEl.innerText = `${spot.name}即時第一湧浪`;
    
    const navTitleEl = document.getElementById('spotNavTitle');
    if (navTitleEl) navTitleEl.innerText = spot.badge;

    const footerSpotEl = document.getElementById('footerSpotDesc');
    if (footerSpotEl) {
      const latStr = Math.abs(spot.lat).toFixed(4) + (spot.lat >= 0 ? '°N' : '°S');
      const lonStr = Math.abs(spot.lon).toFixed(4) + (spot.lon >= 0 ? '°E' : '°W');
      footerSpotEl.innerText = `熱點: ${spot.name} (${latStr}, ${lonStr}) · ${spot.agencyName}`;
    }

    const forecastTitleEl = document.getElementById('forecastTitle');
    if (forecastTitleEl) {
      if (spot.agency === 'HKO') {
        forecastTitleEl.innerText = 'HKO 5-DAY FORECAST (香港天文台五日預測)';
      } else if (spot.agency === 'CWA') {
        forecastTitleEl.innerText = 'CWA 5-DAY FORECAST (中央氣象署五日預報)';
      } else {
        forecastTitleEl.innerText = 'BMKG 5-DAY FORECAST (印尼氣象局五日預報)';
      }
    }

    const dotsContainer = document.getElementById('spotDots');
    if (dotsContainer) {
      dotsContainer.innerHTML = SURF_SPOTS.map((s, idx) => 
        `<span class="spot-dot ${idx === currentSpotIdx ? 'active' : ''}" onclick="switchSpot(${idx})" title="${s.name} (${s.agency})"></span>`
      ).join('');
    }
  }

  // 觸控滑動手勢
  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;

  const mainContainer = document.getElementById('mainContainer');
  if (mainContainer) {
    mainContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
      touchStartTime = Date.now();
    }, { passive: true });

    mainContainer.addEventListener('touchend', (e) => {
      const endX = e.changedTouches[0].screenX;
      const endY = e.changedTouches[0].screenY;
      const diffX = endX - touchStartX;
      const diffY = endY - touchStartY;
      const duration = Date.now() - touchStartTime;

      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY) * 1.3 && duration < 600) {
        if (diffX > 0) {
          nextSpot();
        } else {
          prevSpot();
        }
      }
    }, { passive: true });
  }

  // 鍵盤方向鍵支援
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSpot();
    if (e.key === 'ArrowLeft') prevSpot();
  });

  // 12 小時制 AM/PM 大時鐘 (時:分)
  function runClock() {
    const now = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    let hours = now.getHours();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    
    const ampmEl = document.getElementById('ampm');
    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date');
    const wkdayEl = document.getElementById('wkday');

    if (ampmEl) ampmEl.innerText = ampm;
    if (clockEl) clockEl.innerText = `${pad(hours)}:${pad(now.getMinutes())}`;
    if (dateEl) dateEl.innerText = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())}`;
    if (wkdayEl) wkdayEl.innerText = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][now.getDay()];
  }
  setInterval(runClock, 1000);
  runClock();

  function toggleTheme() {
    document.body.classList.toggle('inverted');
  }

  // WMO 國際氣象代碼轉向量圖標與描述
  function getWmoWeatherInfo(code) {
    if (code === 0) return { icon: '<i class="fa-solid fa-sun" title="天晴"></i>', text: '天晴' };
    if ([1, 2].includes(code)) return { icon: '<i class="fa-solid fa-cloud-sun" title="大致天晴"></i>', text: '大致天晴' };
    if (code === 3) return { icon: '<i class="fa-solid fa-cloud" title="多雲"></i>', text: '多雲' };
    if ([45, 48].includes(code)) return { icon: '<i class="fa-solid fa-smog" title="有霧"></i>', text: '有霧' };
    if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { icon: '<i class="fa-solid fa-cloud-showers-heavy" title="有雨/驟雨"></i>', text: '有雨' };
    if ([95, 96, 99].includes(code)) return { icon: '<i class="fa-solid fa-cloud-bolt" title="雷暴"></i>', text: '雷暴' };
    return { icon: '<i class="fa-solid fa-cloud-sun" title="晴朗"></i>', text: '晴朗' };
  }

  // 渲染警告標籤：香港直接顯示官方文字，海外浪點顯示直連天文台超連結
  function renderWarningBadge(htmlContent, isLink = false, linkUrl = '#', linkTitle = '') {
    const warnBox = document.getElementById('warnContainer');
    if (!warnBox) return;

    if (isLink) {
      warnBox.innerHTML = `
        <a href="${linkUrl}" target="_blank" rel="noopener noreferrer" 
           title="${linkTitle}"
           class="warn-link bg-black text-white px-2 py-0.5 font-black inline-flex items-center gap-1.5 max-w-[340px] truncate rounded-sm ink-b">
          <i class="fa-solid fa-triangle-exclamation text-xs shrink-0"></i>
          <span class="truncate font-black font-fluid-label">${htmlContent}</span>
          <i class="fa-solid fa-arrow-up-right-from-square text-[10px] shrink-0 opacity-80"></i>
        </a>`;
    } else {
      warnBox.innerHTML = `
        <div class="bg-black text-white px-2 py-0.5 font-black inline-flex items-center gap-1.5 max-w-[340px] truncate rounded-sm ink-b">
          <i class="fa-solid fa-shield-halved text-xs shrink-0"></i>

  // 根據浪點加載實時天氣與官方警報
  async function loadWeatherAndWarnings() {
    const spot = SURF_SPOTS[currentSpotIdx];
    const tempEl = document.getElementById('temp');
    const humiEl = document.getElementById('humi');
    const uvEl = document.getElementById('uv');
    const condEl = document.getElementById('cond');

    // 1. 香港浪點：香港天文台 (HKO) 官方 API 直連
    if (spot.agency === 'HKO') {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        if (res.ok) {
          const data = await res.json();
          const hko = data.temperature?.data?.find(t => t.place === '香港天文台') || data.temperature?.data?.[0];
          if (hko && hko.value !== undefined && tempEl) tempEl.innerText = hko.value;
          if (data.humidity?.data?.[0] && humiEl) humiEl.innerText = data.humidity.data[0].value + '%';
          if (data.uvindex?.data?.[0] && uvEl) uvEl.innerText = data.uvindex.data[0].value;
          else if (uvEl) uvEl.innerText = '0';
          const isRain = data.rainfall?.data?.some(r => r.max > 0);
          if (condEl) condEl.innerText = isRain ? '有微雨' : '大致天晴';
        }
      } catch (e) {
        console.warn('HKO weather API fallback:', e);
      }

      try {
        const wRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        if (wRes.ok) {
          const wData = await wRes.json();
          const keys = Object.keys(wData);
          if (keys.length > 0) {
            const WARN_NAMES = {
              'TC1': '一號熱帶氣旋', 'TC3': '三號熱帶氣旋', 'TC8NE': '八號東北烈風', 'TC8SE': '八號東南烈風',
              'TC8NW': '八號西北烈風', 'TC8SW': '八號西南烈風', 'TC8': '八號烈風暴風', 'TC9': '九號風力增強',
              'TC10': '十號颶風信號', 'WRAINA': '黃色暴雨警告', 'WRAINR': '紅色暴雨警告', 'WRAINB': '黑色暴雨警告',
              'WTS': '雷暴警告', 'WMS': '強烈季候風信號', 'WFIREY': '黃色火災危險', 'WFIRER': '紅色火災危險',
              'WHOT': '酷熱天氣警告', 'WCOLD': '寒冷天氣警告', 'WL': '山泥傾瀉警告', 'WFNL': '新界北部水浸',
              'WFROST': '霜凍警告', 'WTMW': '海嘯警告'
            };

            const priority = ['WTCSGNL', 'WRAIN', 'WTS', 'WTMW', 'WL', 'WMS', 'WHOT', 'WCOLD', 'WFIRE', 'WFROST'];
            keys.sort((a, b) => {
              const idxA = priority.indexOf(a) === -1 ? 99 : priority.indexOf(a);
              const idxB = priority.indexOf(b) === -1 ? 99 : priority.indexOf(b);
              return idxA - idxB;
            });

            const hasThunderstorm = keys.some(k => k === 'WTS' || wData[k]?.code === 'WTS');
            const otherWarnings = keys
              .filter(k => k !== 'WTS' && wData[k]?.code !== 'WTS')
              .map(k => {
                const item = wData[k];
                const code = item.code || '';
                return WARN_NAMES[code] || item.type || item.name || '特別天氣警告';
              });

            const boltIcon = '<i class="fa-solid fa-bolt text-[10px] text-white"></i>';

            if (otherWarnings.length > 0) {
              const textPart = otherWarnings.slice(0, 2).join(' · ');
              renderWarningBadge(hasThunderstorm ? `${textPart} ${boltIcon}` : textPart, false);
            } else if (hasThunderstorm) {
              renderWarningBadge(`${boltIcon} 雷暴生效中`, false);
            } else {
              renderWarningBadge('現在並沒有任何警告信號', false);
            }
          } else {
            renderWarningBadge('現在並沒有任何警告信號', false);
          }
        }
      } catch (e) {
        renderWarningBadge('現在並沒有任何警告信號', false);
      }
      return;
    }

    // 2. 海外浪點（台灣 CWA、印尼 BMKG 等）：即時天氣由 Open-Meteo 獲取，警報轉換為官方直連外鏈
    try {
      const tz = spot.timezone || 'auto';
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lon}&current=temperature_2m,relative_humidity_2m,weather_code,uv_index,wind_speed_10m&timezone=${encodeURIComponent(tz)}`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (tempEl && data.current?.temperature_2m !== undefined) tempEl.innerText = Math.round(data.current.temperature_2m);
        if (humiEl && data.current?.relative_humidity_2m !== undefined) humiEl.innerText = Math.round(data.current.relative_humidity_2m) + '%';
        if (uvEl && data.current?.uv_index !== undefined) uvEl.innerText = Math.round(data.current.uv_index);
        if (condEl && data.current?.weather_code !== undefined) {
          condEl.innerText = getWmoWeatherInfo(data.current.weather_code).text;
        }
      }
    } catch (e) {
      console.warn('Regional weather API fallback:', e);
    }

    // 關鍵處理：海外浪點無法直連官方警報時，顯示可點擊的專屬超連結按鈕
    const agencyLabel = spot.agency === 'CWA' ? '中央氣象署' : '印尼 BMKG';
    const warningPrompt = `海外浪點無法直連警報 · 查閱${agencyLabel}`;
    renderWarningBadge(
      warningPrompt, 
      true, 
      spot.officialWarningUrl, 
      `海外浪點無法直接獲取實時警報，點此前往 ${spot.agencyName} 官方網站手動查看最新警特報`
    );
  }

  function getWeatherIcon(desc, iconCode) {
    const text = desc || '';
    if (text.includes('雷')) return '<i class="fa-solid fa-cloud-bolt" title="雷暴"></i>';
    if (text.includes('雨') || text.includes('驟雨')) return '<i class="fa-solid fa-cloud-showers-heavy" title="驟雨/有雨"></i>';
    if (text.includes('晴') && (text.includes('雲') || text.includes('短暫') || text.includes('大致'))) return '<i class="fa-solid fa-cloud-sun" title="短暫陽光/大致天晴"></i>';
    if (text.includes('晴') || text.includes('天晴')) return '<i class="fa-solid fa-sun" title="天晴"></i>';
    if (text.includes('陰') || text.includes('多雲') || text.includes('雲')) return '<i class="fa-solid fa-cloud" title="多雲/陰天"></i>';
    if (text.includes('霧') || text.includes('薄霧')) return '<i class="fa-solid fa-smog" title="有霧"></i>';
    if (text.includes('風')) return '<i class="fa-solid fa-wind" title="風勢較大"></i>';

    if (iconCode >= 50 && iconCode <= 52) return '<i class="fa-solid fa-sun" title="天晴"></i>';
    if (iconCode >= 53 && iconCode <= 54) return '<i class="fa-solid fa-cloud-sun" title="大致天晴"></i>';
    if (iconCode >= 60 && iconCode <= 61) return '<i class="fa-solid fa-cloud" title="多雲"></i>';
    if (iconCode >= 62 && iconCode <= 65) return '<i class="fa-solid fa-cloud-showers-heavy" title="有雨"></i>';
    return '<i class="fa-solid fa-sun" title="晴"></i>';
  }

  async function loadForecast() {
    const spot = SURF_SPOTS[currentSpotIdx];
    const container = document.getElementById('f_mini');
    if (!container) return;

    if (spot.agency === 'HKO') {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        if (res.ok) {
          const data = await res.json();
          if (data.weatherForecast && data.weatherForecast.length > 0) {
            container.innerHTML = '';
            data.weatherForecast.slice(0, 5).forEach((f, i) => {
              const isToday = i === 0;
              const wk = isToday ? '今' : f.week.replace('星期', '');
              const wDesc = f.forecastWeather || '';
              const iconCode = f.ForecastIcon;
              const weatherIcon = getWeatherIcon(wDesc, iconCode);

              container.innerHTML += `
                <div class="f-mini-cell ${isToday ? 'active-f' : ''}">
                  <div class="font-fluid-forecast font-black">${wk}</div>
                  <div class="my-0.5 font-fluid-forecast flex items-center justify-center h-[1.3em]">${weatherIcon}</div>
                  <div class="font-mono font-fluid-footer font-black tracking-tighter truncate">${f.forecastMintemp.value}-${f.forecastMaxtemp.value}°</div>
                </div>`;
            });
            return;
          }
        }
      } catch (e) {
        console.warn('HKO forecast fallback:', e);
      }
    } else {
      try {
        const tz = spot.timezone || 'auto';
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=5&timezone=${encodeURIComponent(tz)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          const daily = data.daily;
          if (daily?.time && daily.time.length >= 5) {
            container.innerHTML = '';
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            for (let i = 0; i < 5; i++) {
              const dObj = new Date(daily.time[i]);
              const wk = (i === 0) ? '今' : weekDays[dObj.getDay()];
              const code = daily.weather_code[i];
              const weatherIcon = getWmoWeatherInfo(code).icon;
              const minT = Math.round(daily.temperature_2m_min[i]);
              const maxT = Math.round(daily.temperature_2m_max[i]);

              container.innerHTML += `
                <div class="f-mini-cell ${i === 0 ? 'active-f' : ''}">
                  <div class="font-fluid-forecast font-black">${wk}</div>
                  <div class="my-0.5 font-fluid-forecast flex items-center justify-center h-[1.3em]">${weatherIcon}</div>
                  <div class="font-mono font-fluid-footer font-black tracking-tighter truncate">${minT}-${maxT}°</div>
                </div>`;
            }
            return;
          }
        }
      } catch (e) {
        console.warn('Regional forecast API fallback:', e);
      }
    }
    renderFallbackForecast();

  // 計算全日潮時與即時潮況趨勢 (P1)
  function loadTideTimes() {
    const now = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    const spot = SURF_SPOTS[currentSpotIdx];
    
    const refNewMoon = new Date('2024-01-11T11:57:00Z');
    const diffDays = (now - refNewMoon) / (1000 * 60 * 60 * 24);
    const moonAge = (diffDays % 29.53058867 + 29.53058867) % 29.53058867;
    
    const period = 12.4206;
    const baseHigh = ((moonAge * 0.84 + 8.6 + spot.tideOffsetHours) % period + period) % period;
    
    const events = [];
    for (let k = -2; k <= 3; k++) {
      const hTime = baseHigh + k * period;
      events.push({ type: 'HIGH', time: hTime });
      const lTime = hTime + (period / 2);
      events.push({ type: 'LOW', time: lTime });
    }
    events.sort((a, b) => a.time - b.time);

    const nowFloat = now.getHours() + (now.getMinutes() / 60) + (now.getSeconds() / 3600);
    const nextEvent = events.find(ev => ev.time > nowFloat);

    const badgeEl = document.getElementById('tideNowBadge');
    if (badgeEl && nextEvent) {
      const isRising = (nextEvent.type === 'HIGH');
      const diffHours = (nextEvent.time - nowFloat).toFixed(1);
      if (isRising) {
        badgeEl.innerHTML = `▲ 漲潮中 (${diffHours}h滿)`;
        badgeEl.className = "bg-black text-white text-[0.74rem] px-1.5 py-0.2 font-black rounded-sm leading-none whitespace-nowrap";
      } else {
        badgeEl.innerHTML = `▼ 退潮中 (${diffHours}h乾)`;
        badgeEl.className = "bg-black text-white text-[0.74rem] px-1.5 py-0.2 font-black rounded-sm leading-none whitespace-nowrap";
      }
    }

    const highTides = events.filter(e => e.type === 'HIGH' && e.time >= 0 && e.time < 24).map(e => e.time);
    const lowTides = events.filter(e => e.type === 'LOW' && e.time >= 0 && e.time < 24).map(e => e.time);

    const formatTime = (hFloat) => {
      const h = Math.floor(hFloat);
      const m = Math.floor((hFloat % 1) * 60);
      return `${pad(h % 24)}:${pad(m % 60)}`;
    };
    
    const highStr = highTides.map(formatTime).join('  ');
    const lowStr = lowTides.map(formatTime).join('  ');
    
    const tideEl = document.getElementById('tideTimes');
    if (tideEl) {
      tideEl.innerHTML = `<span class="block truncate">▲ ${highStr || '--:--'}</span><span class="block truncate">▼ ${lowStr || '--:--'}</span>`;
      tideEl.title = `今日天文潮位預測：漲潮 ${highTides.map(formatTime).join(', ')} | 退潮 ${lowTides.map(formatTime).join(', ')}`;
    }
  }

  // 浪向動態箭頭更新 (P2)
  function updateWaveDirectionUI(dirDegrees) {
    const arrowEl = document.getElementById('cs_dr_arrow');
    const dirEl = document.getElementById('cs_dr');
    if (!dirEl || !arrowEl) return;

    // 波浪朝向岸邊推進的角度
    const propagationAngle = (dirDegrees + 180) % 360;
    arrowEl.style.transform = `rotate(${propagationAngle}deg)`;

    const dirs = ['北 (N)', '東北 (NE)', '東 (E)', '東南 (SE)', '南 (S)', '西南 (SW)', '西 (W)', '西北 (NW)'];
    const idx = Math.round(dirDegrees / 45) % 8;
    dirEl.innerText = dirs[idx];
  }

  // 獲取 5 天第一湧浪深度趨勢統計
  async function loadSwellStats() {
    const spot = SURF_SPOTS[currentSpotIdx];
    const statsGrid = document.getElementById('cs_stats');
    
    try {
      const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lon}&current=wave_height,swell_wave_height,swell_wave_direction,swell_wave_period&hourly=wave_height,swell_wave_height,swell_wave_period&forecast_days=5&timezone=auto`;
      const res = await fetch(url);
      
      if (res.ok) {
        const data = await res.json();
        
        const curSwell = (typeof data.current?.swell_wave_height === 'number') ? data.current.swell_wave_height : 0.8;
        const curPeriod = (typeof data.current?.swell_wave_period === 'number') ? Math.round(data.current.swell_wave_period) : 7;
        const curDir = (typeof data.current?.swell_wave_direction === 'number') ? data.current.swell_wave_direction : 180;
        const curTotal = (typeof data.current?.wave_height === 'number') ? data.current.wave_height : 1.0;

        document.getElementById('cs_now').innerText = curSwell.toFixed(1);
        document.getElementById('cs_now_ft').innerText = `(${(curSwell * 3.28).toFixed(1)}呎)`;
        document.getElementById('cs_pd').innerText = curPeriod + 's';
        document.getElementById('cs_total').innerText = curTotal.toFixed(1) + 'm';
        
        updateWaveDirectionUI(curDir);

        if (statsGrid) {
          statsGrid.innerHTML = '';
          const hourlySwell = data.hourly?.swell_wave_height || [];
          const hourlyPd = data.hourly?.swell_wave_period || [];
          const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
          const baseDate = new Date();

          for (let day = 0; day < 5; day++) {
            const targetDate = new Date(baseDate);
            targetDate.setDate(baseDate.getDate() + day);
            const m = targetDate.getMonth() + 1;
            const d = targetDate.getDate();
            const wk = weekDays[targetDate.getDay()];

            const startIdx = day * 24;
            const endIdx = (day + 1) * 24;
            const dayHeights = hourlySwell.slice(startIdx, endIdx);
            const dayPds = hourlyPd.slice(startIdx, endIdx);

            let avg = '0.8', min = '0.6', max = '1.0', avgPd = 7;
            if (dayHeights.length > 0) {
              avg = (dayHeights.reduce((a, b) => a + b, 0) / dayHeights.length).toFixed(1);
              min = Math.min(...dayHeights).toFixed(1);
              max = Math.max(...dayHeights).toFixed(1);
            }
            if (dayPds.length > 0) {
              avgPd = Math.round(dayPds.reduce((a, b) => a + b, 0) / dayPds.length);
            }

            const isToday = (day === 0);
            const isFullSwell = parseFloat(avg) >= 1.5;
            const waveVisual = isFullSwell
              ? `<i class="fa-solid fa-water text-xs leading-none" title="滿格浪況 (≥1.5m)"></i>`
              : '';

            statsGrid.innerHTML += `
              <div class="stats-cell ${isToday ? 'active-day' : ''}">
                <div class="font-fluid-label font-black leading-tight pt-0.5 truncate w-full text-center">
                  ${m}/${d}(${wk})
                </div>
                <div class="w-full flex items-center justify-center h-3 my-0.5">
                  ${waveVisual}
                </div>
                <div class="font-mono font-fluid-value font-black leading-none my-0.5 text-base sm:text-xl">
                  ${avg}<span class="font-fluid-footer font-black ml-0.5">m</span>
                </div>
                <div class="font-fluid-footer font-mono font-black leading-tight truncate">
                  ${min}-${max}m
                </div>
                <div class="font-fluid-footer font-mono font-black border-t-2 ${isToday ? 'border-white' : 'border-black'} border-solid w-full pt-1 mt-0.5 leading-none truncate text-[0.8rem] sm:text-[0.95rem]">
                  ${avgPd}s
                </div>
              </div>`;
          }
        }
        return;
      }
    } catch (e) {
      console.warn('Swell stats fallback for spot:', spot.name, e);
    }
    
    renderFallbackSwellStats();
  }

  function renderFallbackSwellStats() {
    const statsGrid = document.getElementById('cs_stats');
    if (!statsGrid) return;
    statsGrid.innerHTML = '';
    
    const spot = SURF_SPOTS[currentSpotIdx];
    const isEastCoast = currentSpotIdx > 0;
    const baseAvg = isEastCoast ? '1.1' : '0.8';
    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    const baseDate = new Date();

    const fallbackData = [
      { avg: baseAvg, min: '0.6', max: '1.2', pd: 7, active: true },
      { avg: isEastCoast ? '1.5' : '1.0', min: '0.8', max: '1.6', pd: 8, active: false },
      { avg: isEastCoast ? '1.6' : '1.2', min: '1.0', max: '1.8', pd: 9, active: false },
      { avg: '0.7', min: '0.5', max: '0.9', pd: 6, active: false },
      { avg: '0.6', min: '0.4', max: '0.8', pd: 6, active: false }
    ];

    updateWaveDirectionUI(180);

    fallbackData.forEach((item, day) => {
      const targetDate = new Date(baseDate);
      targetDate.setDate(baseDate.getDate() + day);
      const m = targetDate.getMonth() + 1;
      const d = targetDate.getDate();
      const wk = weekDays[targetDate.getDay()];

      const isFullSwell = parseFloat(item.avg) >= 1.5;
      const waveVisual = isFullSwell
        ? `<i class="fa-solid fa-water text-xs leading-none" title="滿格浪況 (≥1.5m)"></i>`
        : '';

      statsGrid.innerHTML += `
        <div class="stats-cell ${item.active ? 'active-day' : ''}">
          <div class="font-fluid-label font-black leading-tight pt-0.5 truncate w-full text-center">
            ${m}/${d}(${wk})
          </div>
          <div class="w-full flex items-center justify-center h-3 my-0.5">
            ${waveVisual}
          </div>
          <div class="font-mono font-fluid-value font-black leading-none my-0.5 text-base sm:text-xl">
            ${item.avg}<span class="font-fluid-footer font-black ml-0.5">m</span>
          </div>
          <div class="font-fluid-footer font-mono font-black leading-tight truncate">${item.min}-${item.max}m</div>
          <div class="font-fluid-footer font-mono font-black border-t-2 ${item.active ? 'border-white' : 'border-black'} border-solid w-full pt-1 mt-0.5 leading-none truncate text-[0.8rem] sm:text-[0.95rem]">${item.pd}s</div>
        </div>`;
    });
  }

  async function fetchAllData() {
    const icon = document.getElementById('syncIcon');
    if (icon) icon.classList.add('fa-spin');
    
    await Promise.allSettled([
      loadWeatherAndWarnings(),
      loadForecast(),
      loadSwellStats(),
      Promise.resolve(loadTideTimes())
    ]);
    
    const now = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    const updateEl = document.getElementById('lastUpdated');
    if (updateEl) {
      updateEl.innerText = `UPDATED: ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    
    if (icon) setTimeout(() => icon.classList.remove('fa-spin'), 500);
  }

  // 墨水屏防殘影：每 30 分鐘自動快閃反色一次
  function triggerAutoInversion() {
    const wasInverted = document.body.classList.contains('inverted');
    if (!wasInverted) {
      document.body.classList.add('inverted');
    } else {
      document.body.classList.remove('inverted');
    }

    setTimeout(() => {
      if (!wasInverted) {
        document.body.classList.remove('inverted');
      } else {
        document.body.classList.add('inverted');
      }
    }, 1200);
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateSpotUI();
    fetchAllData();
    setInterval(fetchAllData, 15 * 60 * 1000);
    setInterval(triggerAutoInversion, 30 * 60 * 1000);
  });
</script>
