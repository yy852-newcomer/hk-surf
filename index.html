<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="香港三大熱點即時第一湧浪浪況、5天深度趨勢統計與香港天文台即時氣象儀表板">
  <title>香港衝浪浪況 & 天氣儀表板 (HK Surf)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=JetBrains+Mono:wght@700;900&display=swap');
    
    *, *::before, *::after { 
      box-sizing: border-box; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #ffffff; 
      color: #000000;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang SC", "Microsoft JhengHei", "微軟正黑體", sans-serif;
      user-select: none;
      touch-action: pan-y pinch-zoom;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .font-mono { 
      font-family: 'JetBrains Mono', Consolas, Monaco, "Courier New", monospace; 
    }

    /* 彈性自適應容器：手機滿屏、10吋平板或大螢幕擴展至 1080px 釋放全部空間 */
    .screen-container {
      width: 100%;
      max-width: 1080px; 
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 12px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 12px);
      display: flex; 
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(4px, 1.2vh, 12px);
      position: relative;
    }

    /* 墨水屏純黑高反差邊框 */
    .ink-b { border: 2px solid #000000; }
    .ink-b-b { border-bottom: 2px solid #000000; }
    .ink-b-r { border-right: 2px solid #000000; }
    .ink-b-t { border-top: 2px solid #000000; }

    /* 反色模式支援 (Night / Inverted E-Ink) */
    .inverted { background-color: #000000 !important; color: #ffffff !important; }
    .inverted .ink-b, .inverted .ink-b-b, .inverted .ink-b-r, .inverted .ink-b-t { border-color: #ffffff !important; }
    .inverted .bg-white { background-color: #000000 !important; color: #ffffff !important; }
    .inverted .bg-black { background-color: #ffffff !important; color: #000000 !important; }
    .inverted .text-black { color: #ffffff !important; }
    .inverted .text-white { color: #000000 !important; }
    .inverted .border-black { border-color: #ffffff !important; }
    .inverted .border-white { border-color: #000000 !important; }
    .inverted .stats-cell { background-color: #000000 !important; border-color: #ffffff !important; color: #ffffff !important; }
    .inverted .stats-cell.active-day { background-color: #ffffff !important; color: #000000 !important; }
    .inverted .f-mini-cell { border-color: #ffffff !important; color: #ffffff !important; }
    .inverted .f-mini-cell.active-f { background-color: #ffffff !important; color: #000000 !important; }
    .inverted .spot-dot.active { background-color: #ffffff !important; }
    .inverted .spot-dot { border-color: #ffffff !important; }

    /* 5 天第一湧浪深度趨勢統計網格 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(3px, 0.8vw, 8px);
      width: 100%;
    }

    .stats-cell {
      border: 2px solid #000000;
      background-color: #ffffff;
      padding: clamp(4px, 1vh, 10px) 2px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      min-width: 0;
    }

    .stats-cell.active-day {
      background-color: #000000;
      color: #ffffff;
    }

    /* 5 天天文台微型預報條 */
    .f-mini-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(3px, 0.8vw, 8px);
      width: 100%;
    }
    .f-mini-cell {
      border: 2px solid #000000;
      padding: clamp(3px, 0.8vh, 8px) 2px;
      text-align: center;
      min-width: 0;
      line-height: 1.25;
    }
    .f-mini-cell.active-f {
      background-color: #000000;
      color: #ffffff;
      font-weight: 900;
    }

    /* 據點指示點 */
    .spot-dot {
      width: 8px;
      height: 8px;
      border: 2px solid #000000;
      border-radius: 9999px;
      display: inline-block;
      cursor: pointer;
    }
    .spot-dot.active {
      background-color: #000000;
    }

    /* 平板及大螢幕（寬度大於 768px 或橫向）版面自適應調整 */
    @media (min-width: 768px) {
      .tablet-layout-grid {
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: 16px;
        align-items: stretch;
      }
      .spot-dot {
        width: 10px;
        height: 10px;
      }
    }
  </style>
</head>
<body>

<div class="screen-container" id="mainContainer">

  <!-- 1. 頂部抬頭區：據點切換、警告標籤與大時鐘 -->
  <header class="flex justify-between items-center shrink-0 pt-1 pb-1 border-b-2 border-black">
    <div class="flex flex-col gap-1.5 min-w-0 pr-2">
      <div class="flex items-center gap-2 flex-wrap">
        <!-- 據點切換按鈕 -->
        <div class="inline-flex items-center bg-black text-white px-2.5 py-1 text-xs md:text-sm font-black tracking-wider select-none shrink-0">
          <button onclick="prevSpot()" class="px-1 text-xs md:text-sm font-black hover:opacity-75 cursor-pointer" title="上一個浪點" aria-label="上一個浪點">◀</button>
          <span class="mx-1.5 cursor-pointer font-black" onclick="nextSpot()">HK SURF</span>
          <button onclick="nextSpot()" class="px-1 text-xs md:text-sm font-black hover:opacity-75 cursor-pointer" title="下一個浪點" aria-label="下一個浪點">▶</button>
        </div>
        
        <!-- 3 個浪點指示圓點 -->
        <div class="flex items-center gap-2 px-1 shrink-0" id="spotDots">
          <span class="spot-dot active" onclick="switchSpot(0)" title="下長沙"></span>
          <span class="spot-dot" onclick="switchSpot(1)" title="港島大浪灣"></span>
          <span class="spot-dot" onclick="switchSpot(2)" title="西貢大浪灣"></span>
        </div>

        <button onclick="toggleTheme()" title="反色模式切換" aria-label="反色切換" class="ink-b px-2 py-1 text-xs md:text-sm font-black active:bg-black active:text-white cursor-pointer shrink-0"><i class="fa-solid fa-circle-half-stroke"></i></button>
        <button onclick="fetchAllData()" title="手動刷新數據" aria-label="更新數據" class="ink-b px-2 py-1 text-xs md:text-sm font-black active:bg-black active:text-white cursor-pointer shrink-0"><i id="syncIcon" class="fa-solid fa-rotate"></i></button>
      </div>
      <!-- HKO 實時特別警告標籤 -->
      <div id="warnBadge" class="bg-black text-white text-xs md:text-sm px-2.5 py-0.5 font-black inline-flex items-center gap-1.5 max-w-full truncate">
        <i class="fa-solid fa-shield-halved text-xs shrink-0"></i>
        <span id="warnText" class="truncate font-black">天文台信號解除 (正常)</span>
      </div>
    </div>
    
    <!-- 右側 12 小時制 AM/PM 大時鐘 (時:分) -->
    <div class="text-right leading-none flex flex-col justify-center items-end shrink-0 pl-2">
      <div class="flex items-baseline justify-end gap-1.5">
        <span id="ampm" class="font-mono text-sm md:text-lg font-black tracking-tight">AM</span>
        <span id="clock" class="font-mono text-4xl sm:text-5xl md:text-6xl font-black tracking-tighter leading-none">--:--</span>
      </div>
      <div class="text-xs sm:text-sm md:text-base font-black mt-1 tracking-tight whitespace-nowrap">
        <span id="date">----/--/--</span>
        <span id="wkday" class="ml-2 border-b-2 border-black font-black">星期-</span>
      </div>
    </div>
  </header>

  <!-- 核心內容區：在手機上為垂直單欄，在 10 吋平板或寬螢幕自動轉為大氣雙欄 -->
  <main class="flex-1 flex flex-col justify-between gap-3 my-auto py-1 tablet-layout-grid">

    <!-- 左半部（平板模式）：實時氣候速報 & 即時第一湧浪核心卡片 -->
    <div class="flex flex-col justify-between gap-3">
      
      <!-- 2. 香港天文台實時氣候速報 -->
      <section class="ink-b grid grid-cols-[1fr_1.1fr_0.9fr_0.8fr_2.4fr] text-center items-center py-2 px-1 bg-white shrink-0">
        <div class="ink-b-r px-1 min-w-0">
          <p class="text-[11px] sm:text-xs md:text-sm font-black uppercase">氣溫</p>
          <p class="font-mono text-lg sm:text-xl md:text-2xl font-black leading-none mt-1"><span id="temp">28</span>°</p>
        </div>
        <div class="ink-b-r px-1 min-w-0">
          <p class="text-[11px] sm:text-xs md:text-sm font-black uppercase">天氣</p>
          <p id="cond" class="text-xs sm:text-sm md:text-base font-black leading-tight mt-1 truncate">大致天晴</p>
        </div>
        <div class="ink-b-r px-1 min-w-0">
          <p class="text-[11px] sm:text-xs md:text-sm font-black uppercase">濕度</p>
          <p id="humi" class="font-mono text-sm sm:text-base md:text-lg font-black mt-1">78%</p>
        </div>
        <div class="ink-b-r px-1 min-w-0">
          <p class="text-[11px] sm:text-xs md:text-sm font-black uppercase">UV</p>
          <p id="uv" class="font-mono text-sm sm:text-base md:text-lg font-black mt-1">6</p>
        </div>
        <div class="px-1.5 min-w-0">
          <p class="text-[11px] sm:text-xs md:text-sm font-black uppercase">今日潮汐預測</p>
          <p id="tideTimes" class="font-mono text-[11px] sm:text-xs md:text-sm font-black leading-tight mt-1 tracking-tight">
            <span class="block truncate">▲ --:--</span>
            <span class="block truncate">▼ --:--</span>
          </p>
        </div>
      </section>

      <!-- 3. 即時第一湧浪核心卡片 (已移除外框邊框，維持乾淨內距) -->
      <section class="p-3 bg-white flex-1 flex flex-col justify-center">
        <div class="grid grid-cols-12 items-center gap-3">
          <!-- 左側：特大浪高數值 -->
          <div class="col-span-7 flex flex-col justify-between h-full min-w-0">
            <div>
              <div id="spotTitle" class="text-xs sm:text-sm md:text-base font-black uppercase tracking-wider border-b-2 border-black inline-block mb-1.5 truncate max-w-full">
                下長沙即時第一湧浪
              </div>
            </div>
            <div class="flex items-baseline gap-2 my-auto flex-wrap">
              <span id="cs_now" class="font-mono text-5xl sm:text-6xl md:text-7xl font-black leading-none tracking-tighter">0.8</span>
              <span class="text-xl sm:text-2xl md:text-3xl font-black">m</span>
              <span id="cs_now_ft" class="text-xs sm:text-sm md:text-base font-mono font-black whitespace-nowrap">(2.6呎)</span>
            </div>
          </div>
          
          <!-- 右側：指標列表 -->
          <div class="col-span-5 pl-2.5 border-l-2 border-black grid grid-rows-3 gap-y-1.5 h-full py-0.5 min-w-0">
            <div class="grid grid-cols-[46px_1fr] md:grid-cols-[54px_1fr] items-center gap-x-1.5 min-w-0">
              <span class="text-[10px] sm:text-xs md:text-sm font-black bg-black text-white py-0.5 text-center shrink-0 leading-tight">週期</span>
              <span id="cs_pd" class="font-mono text-base sm:text-lg md:text-xl font-black text-right leading-none truncate">7s</span>
            </div>
            <div class="grid grid-cols-[46px_1fr] md:grid-cols-[54px_1fr] items-center gap-x-1.5 min-w-0">
              <span class="text-[10px] sm:text-xs md:text-sm font-black bg-black text-white py-0.5 text-center shrink-0 leading-tight">浪向</span>
              <span id="cs_dr" class="font-black text-xs sm:text-sm md:text-base text-right leading-none truncate">南 (S)</span>
            </div>
            <div class="grid grid-cols-[46px_1fr] md:grid-cols-[54px_1fr] items-center gap-x-1.5 min-w-0">
              <span class="text-[10px] sm:text-xs md:text-sm font-black bg-black text-white py-0.5 text-center shrink-0 leading-tight">總浪</span>
              <span id="cs_total" class="font-mono text-sm sm:text-base md:text-lg font-black text-right leading-none truncate">1.0m</span>
            </div>
          </div>
        </div>
      </section>

    </div>

    <!-- 右半部（平板模式）：未來 5 天深度趨勢統計 & 天文台 5 天微型預報 -->
    <div class="flex flex-col justify-between gap-3">

      <!-- 4. 重點核心：未來 5 天第一湧浪深度趨勢統計 -->
      <section class="ink-b p-2.5 bg-white flex-1 flex flex-col justify-between">
        <div class="flex justify-between items-center border-b-2 border-black pb-1 mb-1.5 shrink-0">
          <span class="text-xs sm:text-sm md:text-base font-black tracking-wider flex items-center gap-1.5">
            <i class="fa-solid fa-chart-simple text-xs"></i> <span id="statsTitle">未來 5 天第一湧浪深度趨勢統計</span>
          </span>
          <span class="text-[11px] sm:text-xs md:text-sm font-black inline-flex items-center gap-1 whitespace-nowrap">
            ≥1.5m 滿浪圖 <i class="fa-solid fa-water text-xs"></i>
          </span>
        </div>
        
        <!-- 5 天統計卡片網格 -->
        <div class="stats-grid flex-1 items-stretch" id="cs_stats">
          <div class="col-span-5 text-center text-sm py-4 font-mono font-black">載入 5 天湧浪深度數據中...</div>
        </div>
      </section>

      <!-- 5. 香港天文台未來 5 天微型預報條 -->
      <section class="ink-b p-2 bg-white shrink-0">
        <div class="flex justify-between items-center mb-1">
          <span class="text-[11px] sm:text-xs md:text-sm font-black tracking-wider">HKO 5-DAY FORECAST (天文台五日預測)</span>
        </div>
        <div class="f-mini-grid" id="f_mini">
          <!-- 由 JavaScript 動態生成 5 格微縮預報 -->
        </div>
      </section>

    </div>

  </main>

  <!-- 6. 熱點名稱、定位座標與更新時間戳 -->
  <footer class="flex justify-between items-center text-xs sm:text-sm font-mono font-bold px-1 shrink-0 border-t-2 border-black pt-1.5 pb-0.5">
    <span class="truncate max-w-[65%]" id="footerSpotDesc">熱點: 下長沙 (22.2312°N, 113.9472°E)</span>
    <span id="lastUpdated" class="shrink-0 ml-2">UPDATED: --:--:--</span>
  </footer>

</div>

<script>
  // 0. 香港三大衝浪熱點經緯度與配置
  const SURF_SPOTS = [
    {
      id: 'cheung_sha',
      name: '下長沙',
      lat: 22.2312,
      lon: 113.9472,
      tideStation: '石壁 / 芝麻灣',
      tideOffsetHours: 0
    },
    {
      id: 'hk_big_wave_bay',
      name: '港島大浪灣',
      lat: 22.2472,
      lon: 114.2492,
      tideStation: '橫瀾島 / 鰂魚涌',
      tideOffsetHours: -0.5
    },
    {
      id: 'sk_tai_long_wan',
      name: '西貢大浪灣',
      lat: 22.4005,
      lon: 114.3752,
      tideStation: '塔門 / 橫瀾島',
      tideOffsetHours: -0.8
    }
  ];

  let currentSpotIdx = 0;

  function switchSpot(index) {
    if (index < 0) index = SURF_SPOTS.length - 1;
    if (index >= SURF_SPOTS.length) index = 0;
    currentSpotIdx = index;
    updateSpotUI();
    loadSwellStats();
    loadTideTimes();
  }

  function nextSpot() { switchSpot(currentSpotIdx + 1); }
  function prevSpot() { switchSpot(currentSpotIdx - 1); }

  function updateSpotUI() {
    const spot = SURF_SPOTS[currentSpotIdx];
    const spotTitleEl = document.getElementById('spotTitle');
    if (spotTitleEl) spotTitleEl.innerText = `${spot.name}即時第一湧浪`;
    
    const footerSpotEl = document.getElementById('footerSpotDesc');
    if (footerSpotEl) footerSpotEl.innerText = `熱點: ${spot.name} (${spot.lat}°N, ${spot.lon}°E)`;

    const dots = document.querySelectorAll('.spot-dot');
    dots.forEach((dot, idx) => {
      if (idx === currentSpotIdx) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    });
  }

  // 觸控手勢支援
  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;

  const mainContainer = document.getElementById('mainContainer');
  if (mainContainer) {
    mainContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
      touchStartTime = Date.now();
    }, { passive: true });

    mainContainer.addEventListener('touchend', (e) => {
      const endX = e.changedTouches[0].screenX;
      const endY = e.changedTouches[0].screenY;
      const diffX = endX - touchStartX;
      const diffY = endY - touchStartY;
      const duration = Date.now() - touchStartTime;

      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY) * 1.3 && duration < 600) {
        if (diffX > 0) {
          nextSpot();
        } else {
          prevSpot();
        }
      }
    }, { passive: true });
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSpot();
    if (e.key === 'ArrowLeft') prevSpot();
  });

  // 1. 時鐘系統
  function runClock() {
    const now = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    let hours = now.getHours();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    
    const ampmEl = document.getElementById('ampm');
    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date');
    const wkdayEl = document.getElementById('wkday');

    if (ampmEl) ampmEl.innerText = ampm;
    if (clockEl) clockEl.innerText = `${pad(hours)}:${pad(now.getMinutes())}`;
    if (dateEl) dateEl.innerText = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())}`;
    if (wkdayEl) wkdayEl.innerText = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][now.getDay()];
  }
  setInterval(runClock, 1000);
  runClock();

  function toggleTheme() {
    document.body.classList.toggle('inverted');
  }

  // 2. 香港天文台實時天氣與警報
  async function loadHKO() {
    try {
      const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
      if (res.ok) {
        const data = await res.json();
        const hko = data.temperature?.data?.find(t => t.place === '香港天文台') || data.temperature?.data?.[0];
        if (hko && hko.value !== undefined) {
          const tempEl = document.getElementById('temp');
          if (tempEl) tempEl.innerText = hko.value;
        }
        if (data.humidity?.data?.[0] && data.humidity.data[0].value !== undefined) {
          const humiEl = document.getElementById('humi');
          if (humiEl) humiEl.innerText = data.humidity.data[0].value + '%';
        }
        if (data.uvindex?.data?.[0] && data.uvindex.data[0].value !== undefined) {
          const uvEl = document.getElementById('uv');
          if (uvEl) uvEl.innerText = data.uvindex.data[0].value;
        } else {
          const uvEl = document.getElementById('uv');
          if (uvEl) uvEl.innerText = '0';
        }
        const isRain = data.rainfall?.data?.some(r => r.max > 0);
        const condEl = document.getElementById('cond');
        if (condEl) condEl.innerText = isRain ? '有微雨' : '大致天晴';
      }
    } catch (e) {
      console.warn('HKO weather API fallback:', e);
    }

    try {
      const wRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
      if (wRes.ok) {
        const wData = await wRes.json();
        const keys = Object.keys(wData);
        if (keys.length > 0) {
          const WARN_NAMES = {
            'TC1': '一號熱帶氣旋', 'TC3': '三號熱帶氣旋', 'TC8NE': '八號東北烈風',
            'TC8SE': '八號東南烈風', 'TC8NW': '八號西北烈風', 'TC8SW': '八號西南烈風',
            'TC8': '八號烈風暴風', 'TC9': '九號風力增強', 'TC10': '十號颶風信號',
            'WRAINA': '黃色暴雨警告', 'WRAINR': '紅色暴雨警告', 'WRAINB': '黑色暴雨警告',
            'WTS': '雷暴警告', 'WMS': '強烈季候風信號', 'WFIREY': '黃色火災危險',
            'WFIRER': '紅色火災危險', 'WHOT': '酷熱天氣警告', 'WCOLD': '寒冷天氣警告',
            'WL': '山泥傾瀉警告', 'WFNL': '新界北部水浸', 'WFROST': '霜凍警告', 'WTMW': '海嘯警告'
          };

          const priority = ['WTCSGNL', 'WRAIN', 'WTS', 'WTMW', 'WL', 'WMS', 'WHOT', 'WCOLD', 'WFIRE', 'WFROST'];
          keys.sort((a, b) => {
            const idxA = priority.indexOf(a) === -1 ? 99 : priority.indexOf(a);
            const idxB = priority.indexOf(b) === -1 ? 99 : priority.indexOf(b);
            return idxA - idxB;
          });

          const hasThunderstorm = keys.some(k => k === 'WTS' || wData[k]?.code === 'WTS');
          const otherWarnings = keys
            .filter(k => k !== 'WTS' && wData[k]?.code !== 'WTS')
            .map(k => {
              const item = wData[k];
              const code = item.code || '';
              return WARN_NAMES[code] || item.type || item.name || '特別天氣警告';
            });

          const warnEl = document.getElementById('warnText');
          const boltIcon = '<i class="fa-solid fa-bolt text-xs text-white"></i>';

          if (warnEl) {
            if (otherWarnings.length > 0) {
              const textPart = otherWarnings.slice(0, 2).join(' · ');
              warnEl.innerHTML = hasThunderstorm ? `${textPart} ${boltIcon}` : textPart;
            } else if (hasThunderstorm) {
              warnEl.innerHTML = `${boltIcon} 雷暴生效`;
            } else {
              warnEl.innerText = '天文台信號解除 (正常)';
            }
          }
        } else {
          const warnEl = document.getElementById('warnText');
          if (warnEl) warnEl.innerText = '天文台信號解除 (正常)';
        }
      }
    } catch (e) {
      const warnEl = document.getElementById('warnText');
      if (warnEl) warnEl.innerText = '天文台信號解除 (正常)';
    }
  }

  // 3. 天文台 5 天微型預報
  async function loadForecast() {
    const container = document.getElementById('f_mini');
    try {
      const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
      if (res.ok) {
        const data = await res.json();
        if (data.weatherForecast && data.weatherForecast.length > 0) {
          container.innerHTML = '';
          data.weatherForecast.slice(0, 5).forEach((f, i) => {
            const isToday = i === 0;
            const wk = isToday ? '今' : f.week.replace('星期', '');
            const wDesc = f.forecastWeather || '';
            let weather = '晴';
            if (wDesc.includes('雷')) weather = '雷';
            else if (wDesc.includes('雨')) weather = '雨';
            else if (wDesc.includes('陰') || wDesc.includes('雲')) weather = '雲';

            container.innerHTML += `
              <div class="f-mini-cell ${isToday ? 'active-f' : 'bg-white'}">
                <div class="text-xs sm:text-sm font-black">${wk}</div>
                <div class="font-black my-1 text-sm sm:text-base">${weather}</div>
                <div class="font-mono text-xs sm:text-sm font-black tracking-tighter truncate">${f.forecastMintemp.value}-${f.forecastMaxtemp.value}°</div>
              </div>`;
          });
          return;
        }
      }
    } catch (e) {
      console.warn('Forecast fallback:', e);
    }
    renderFallbackForecast();
  }

  function renderFallbackForecast() {
    const container = document.getElementById('f_mini');
    if (!container) return;
    container.innerHTML = '';
    const days = ['今', '明', 'D3', 'D4', 'D5'];
    days.forEach((d, i) => {
      container.innerHTML += `
        <div class="f-mini-cell ${i === 0 ? 'active-f' : 'bg-white'}">
          <div class="text-xs sm:text-sm font-black">${d}</div>
          <div class="font-black my-1 text-sm sm:text-base">晴</div>
          <div class="font-mono text-xs sm:text-sm font-black tracking-tighter truncate">26-31°</div>
        </div>`;
    });
  }

  // 3.5 全日潮汐計算
  function loadTideTimes() {
    const now = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    const spot = SURF_SPOTS[currentSpotIdx];
    
    const refNewMoon = new Date('2024-01-11T11:57:00Z');
    const diffDays = (now - refNewMoon) / (1000 * 60 * 60 * 24);
    const moonAge = (diffDays % 29.53058867 + 29.53058867) % 29.53058867;
    
    const period = 12.4206;
    const baseHigh = ((moonAge * 0.84 + 8.6 + spot.tideOffsetHours) % period + period) % period;
    
    const highCandidates = [baseHigh - period, baseHigh, baseHigh + period, baseHigh + period * 2];
    const highTides = highCandidates.filter(t => t >= 0 && t < 24).sort((a, b) => a - b);
    
    const baseLow = baseHigh + (period / 2);
    const lowCandidates = [baseLow - period * 2, baseLow - period, baseLow, baseLow + period, baseLow + period * 2];
    const lowTides = lowCandidates.filter(t => t >= 0 && t < 24).sort((a, b) => a - b);
    
    const formatTime = (hFloat) => {
      const h = Math.floor(hFloat);
      const m = Math.floor((hFloat % 1) * 60);
      return `${pad(h % 24)}:${pad(m % 60)}`;
    };
    
    const highStr = highTides.map(formatTime).join('  ');
    const lowStr = lowTides.map(formatTime).join('  ');
    
    const tideEl = document.getElementById('tideTimes');
    if (tideEl) {
      tideEl.innerHTML = `<span class="block truncate">▲ ${highStr || '--:--'}</span><span class="block truncate">▼ ${lowStr || '--:--'}</span>`;
      tideEl.title = `今日天文潮位預測：漲潮 ${highTides.map(formatTime).join(', ')} | 退潮 ${lowTides.map(formatTime).join(', ')}`;
    }
  }

  // 4. 動態獲取 5 天第一湧浪深度數據
  async function loadSwellStats() {
    const spot = SURF_SPOTS[currentSpotIdx];
    const statsGrid = document.getElementById('cs_stats');
    
    try {
      const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lon}&current=wave_height,swell_wave_height,swell_wave_direction,swell_wave_period&hourly=wave_height,swell_wave_height,swell_wave_period&forecast_days=5&timezone=Asia%2FHong_Kong`;
      const res = await fetch(url);
      
      if (res.ok) {
        const data = await res.json();
        
        const curSwell = (typeof data.current?.swell_wave_height === 'number') ? data.current.swell_wave_height : 0.8;
        const curPeriod = (typeof data.current?.swell_wave_period === 'number') ? Math.round(data.current.swell_wave_period) : 7;
        const curDir = (typeof data.current?.swell_wave_direction === 'number') ? data.current.swell_wave_direction : 180;
        const curTotal = (typeof data.current?.wave_height === 'number') ? data.current.wave_height : 1.0;

        document.getElementById('cs_now').innerText = curSwell.toFixed(1);
        document.getElementById('cs_now_ft').innerText = `(${(curSwell * 3.28).toFixed(1)}呎)`;
        document.getElementById('cs_pd').innerText = curPeriod + 's';
        document.getElementById('cs_total').innerText = curTotal.toFixed(1) + 'm';
        
        const dirs = ['北 (N)', '東北 (NE)', '東 (E)', '東南 (SE)', '南 (S)', '西南 (SW)', '西 (W)', '西北 (NW)'];
        document.getElementById('cs_dr').innerText = dirs[Math.round(curDir / 45) % 8];

        statsGrid.innerHTML = '';
        const hourlySwell = data.hourly?.swell_wave_height || [];
        const hourlyPd = data.hourly?.swell_wave_period || [];
        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        const baseDate = new Date();

        for (let day = 0; day < 5; day++) {
          const targetDate = new Date(baseDate);
          targetDate.setDate(baseDate.getDate() + day);
          const m = targetDate.getMonth() + 1;
          const d = targetDate.getDate();
          const wk = weekDays[targetDate.getDay()];

          const startIdx = day * 24;
          const endIdx = (day + 1) * 24;
          const dayHeights = hourlySwell.slice(startIdx, endIdx);
          const dayPds = hourlyPd.slice(startIdx, endIdx);

          let avg = '0.8', min = '0.6', max = '1.0', avgPd = 7;
          if (dayHeights.length > 0) {
            avg = (dayHeights.reduce((a, b) => a + b, 0) / dayHeights.length).toFixed(1);
            min = Math.min(...dayHeights).toFixed(1);
            max = Math.max(...dayHeights).toFixed(1);
          }
          if (dayPds.length > 0) {
            avgPd = Math.round(dayPds.reduce((a, b) => a + b, 0) / dayPds.length);
          }

          const isToday = (day === 0);
          const isFullSwell = parseFloat(avg) >= 1.5;
          const waveVisual = isFullSwell
            ? `<i class="fa-solid fa-water text-sm sm:text-base leading-none" title="滿格浪況 (≥1.5m)"></i>`
            : '';

          statsGrid.innerHTML += `
            <div class="stats-cell ${isToday ? 'active-day' : ''}">
              <div class="text-xs sm:text-sm font-black leading-tight pt-0.5 truncate w-full text-center">
                ${m}/${d}(${wk})
              </div>
              <div class="w-full flex items-center justify-center h-4 my-1">
                ${waveVisual}
              </div>
              <div class="font-mono text-lg sm:text-xl md:text-2xl font-black leading-none my-1">
                ${avg}<span class="text-xs sm:text-sm font-black ml-0.5">m</span>
              </div>
              <div class="text-xs sm:text-sm font-mono font-black leading-tight truncate">
                ${min}-${max}m
              </div>
              <div class="text-xs sm:text-sm font-mono font-black border-t-2 ${isToday ? 'border-white' : 'border-black'} border-solid w-full pt-1.5 mt-1 leading-none truncate">
                ${avgPd}s
              </div>
            </div>`;
        }
        return;
      }
    } catch (e) {
      console.warn('Swell stats fallback for spot:', spot.name, e);
    }
    
    renderFallbackSwellStats();
  }

  function renderFallbackSwellStats() {
    const statsGrid = document.getElementById('cs_stats');
    if (!statsGrid) return;
    statsGrid.innerHTML = '';
    
    const spot = SURF_SPOTS[currentSpotIdx];
    const isEastCoast = currentSpotIdx > 0;
    const baseAvg = isEastCoast ? '1.1' : '0.8';
    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    const baseDate = new Date();

    const fallbackData = [
      { avg: baseAvg, min: '0.6', max: '1.2', pd: 7, active: true },
      { avg: isEastCoast ? '1.5' : '1.0', min: '0.8', max: '1.6', pd: 8, active: false },
      { avg: isEastCoast ? '1.6' : '1.2', min: '1.0', max: '1.8', pd: 9, active: false },
      { avg: '0.7', min: '0.5', max: '0.9', pd: 6, active: false },
      { avg: '0.6', min: '0.4', max: '0.8', pd: 6, active: false }
    ];

    fallbackData.forEach((item, day) => {
      const targetDate = new Date(baseDate);
      targetDate.setDate(baseDate.getDate() + day);
      const m = targetDate.getMonth() + 1;
      const d = targetDate.getDate();
      const wk = weekDays[targetDate.getDay()];

      const isFullSwell = parseFloat(item.avg) >= 1.5;
      const waveVisual = isFullSwell
        ? `<i class="fa-solid fa-water text-sm sm:text-base leading-none" title="滿格浪況 (≥1.5m)"></i>`
        : '';

      statsGrid.innerHTML += `
        <div class="stats-cell ${item.active ? 'active-day' : ''}">
          <div class="text-xs sm:text-sm font-black leading-tight pt-0.5 truncate w-full text-center">
            ${m}/${d}(${wk})
          </div>
          <div class="w-full flex items-center justify-center h-4 my-1">
            ${waveVisual}
          </div>
          <div class="font-mono text-lg sm:text-xl md:text-2xl font-black leading-none my-1">
            ${item.avg}<span class="text-xs sm:text-sm font-black ml-0.5">m</span>
          </div>
          <div class="text-xs sm:text-sm font-mono font-black leading-tight truncate">${item.min}-${item.max}m</div>
          <div class="text-xs sm:text-sm font-mono font-black border-t-2 ${item.active ? 'border-white' : 'border-black'} border-solid w-full pt-1.5 mt-1 leading-none truncate">${item.pd}s</div>
        </div>`;
    });
  }

  // 5. 數據全面刷新
  async function fetchAllData() {
    const icon = document.getElementById('syncIcon');
    if (icon) icon.classList.add('fa-spin');
    
    await Promise.allSettled([
      loadHKO(),
      loadForecast(),
      loadSwellStats(),
      Promise.resolve(loadTideTimes())
    ]);
    
    const now = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    const updateEl = document.getElementById('lastUpdated');
    if (updateEl) {
      updateEl.innerText = `UPDATED: ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    
    if (icon) setTimeout(() => icon.classList.remove('fa-spin'), 500);
  }

  // 6. 電子墨水屏防殘影：每 30 分鐘自動快閃反色
  function triggerAutoInversion() {
    const wasInverted = document.body.classList.contains('inverted');
    
    if (!wasInverted) {
      document.body.classList.add('inverted');
    } else {
      document.body.classList.remove('inverted');
    }

    setTimeout(() => {
      if (!wasInverted) {
        document.body.classList.remove('inverted');
      } else {
        document.body.classList.add('inverted');
      }
    }, 1200);
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateSpotUI();
    fetchAllData();
    setInterval(fetchAllData, 15 * 60 * 1000);
    setInterval(triggerAutoInversion, 30 * 60 * 1000);
  });
</script>
