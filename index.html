<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <!-- 1. 加入 viewport-fit=cover，適配 iPhone 瀏海屏與各類全螢幕設備 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="香港三大熱點即時第一湧浪浪況、5天深度趨勢統計與香港天文台即時氣象儀表板">
  <title>香港衝浪浪況 & 天氣儀表板 (HK Surf)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&family=JetBrains+Mono:wght@700;900&display=swap');
    
    *, *::before, *::after { 
      box-sizing: border-box; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 關鍵修復：防止不同作業系統與手機瀏覽器自動把字體暴力放大而導致破版 */
    html, body {
      margin: 0; padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh; /* 適配 iOS Safari / Chrome 動態工具列，避免底部被吃掉 */
      background-color: #ffffff; 
      color: #000000;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang SC", "Microsoft JhengHei", "微軟正黑體", sans-serif;
      user-select: none;
      touch-action: pan-y pinch-zoom;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
      overflow-y: auto; /* 螢幕極端過矮時允許平滑滾動，常規螢幕嚴格單屏 */
    }

    .font-mono { 
      font-family: 'JetBrains Mono', Consolas, Monaco, "Courier New", monospace; 
    }

    /* 自適應全設備外框容器：手機滿屏、iPad/平板/電腦居中自適應比例 */
    .screen-container {
      width: 100%;
      max-width: 480px; /* 黃金比例，防止平板與電腦上字體過度拉伸變形 */
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: env(safe-area-inset-top, 6px) env(safe-area-inset-right, 8px) env(safe-area-inset-bottom, 6px) env(safe-area-inset-left, 8px);
      display: flex; 
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(2px, 0.8vh, 6px); /* 彈性間距：根據設備高度自動微調 */
      position: relative;
    }

    /* 墨水屏純黑高反差邊框 (使用 1.5px/2px 確保跨設備不產生模糊像素) */
    .ink-b { border: 1.5px solid #000000; }
    .ink-b-b { border-bottom: 1.5px solid #000000; }
    .ink-b-r { border-right: 1.5px solid #000000; }
    .ink-b-t { border-top: 1.5px solid #000000; }

    /* 反色模式支援 (Night / Inverted E-Ink) */
    .inverted { background-color: #000000 !important; color: #ffffff !important; }
    .inverted .ink-b, .inverted .ink-b-b, .inverted .ink-b-r, .inverted .ink-b-t { border-color: #ffffff !important; }
    .inverted .bg-white { background-color: #000000 !important; color: #ffffff !important; }
    .inverted .bg-black { background-color: #ffffff !important; color: #000000 !important; }
    .inverted .text-black { color: #ffffff !important; }
    .inverted .text-white { color: #000000 !important; }
    .inverted .border-black { border-color: #ffffff !important; }
    .inverted .border-white { border-color: #000000 !important; }
    .inverted .stats-cell { background-color: #000000 !important; border-color: #ffffff !important; color: #ffffff !important; }
    .inverted .stats-cell.active-day { background-color: #ffffff !important; color: #000000 !important; }
    .inverted .f-mini-cell { border-color: #ffffff !important; color: #ffffff !important; }
    .inverted .f-mini-cell.active-f { background-color: #ffffff !important; color: #000000 !important; }
    .inverted .spot-dot.active { background-color: #ffffff !important; }
    .inverted .spot-dot { border-color: #ffffff !important; }

    /* 5 天第一湧浪深度趨勢統計網格 (強制等寬且內容不擠壓) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 3px;
      width: 100%;
    }

    .stats-cell {
      border: 1.5px solid #000000;
      background-color: #ffffff;
      padding: 3px 1px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      min-width: 0; /* 關鍵：防止單元格被內容撐開變形 */
    }

    .stats-cell.active-day {
      background-color: #000000;
      color: #ffffff;
    }

    /* 5 天天文台微型預報條 */
    .f-mini-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 3px;
      width: 100%;
    }
    .f-mini-cell {
      border: 1.5px solid #000000;
      padding: 3px 1px;
      text-align: center;
      min-width: 0;
      line-height: 1.2;
    }
    .f-mini-cell.active-f {
      background-color: #000000;
      color: #ffffff;
      font-weight: 900;
    }

    /* 據點指示點 */
    .spot-dot {
      width: 6px;
      height: 6px;
      border: 1.5px solid #000000;
      border-radius: 9999px;
      display: inline-block;
      cursor: pointer;
    }
    .spot-dot.active {
      background-color: #000000;
    }
  </style>
</head>
<body>

<div class="screen-container" id="mainContainer">

  <!-- 1. 頂部抬頭區：據點導航、警告標籤與 12 小時 AM/PM 大時鐘 (時:分) -->
  <header class="flex justify-between items-center shrink-0 pt-1 pb-0.5">
    <div class="flex flex-col gap-1 min-w-0 pr-2">
      <div class="flex items-center gap-1.5 flex-wrap">
        <!-- 點擊或滑動切換的據點導航 (HK SURF) -->
        <div class="inline-flex items-center bg-black text-white px-2 py-0.5 text-xs font-black tracking-wider select-none shrink-0">
          <button onclick="prevSpot()" class="px-1 text-[10px] hover:opacity-75 cursor-pointer" title="上一個浪點" aria-label="上一個浪點">◀</button>
          <span class="mx-1 cursor-pointer" onclick="nextSpot()">HK SURF</span>
          <button onclick="nextSpot()" class="px-1 text-[10px] hover:opacity-75 cursor-pointer" title="下一個浪點" aria-label="下一個浪點">▶</button>
        </div>
        
        <!-- 3 個浪點的位置圓點指示器 -->
        <div class="flex items-center gap-1.5 px-0.5 shrink-0" id="spotDots">
          <span class="spot-dot active" onclick="switchSpot(0)" title="下長沙"></span>
          <span class="spot-dot" onclick="switchSpot(1)" title="港島大浪灣"></span>
          <span class="spot-dot" onclick="switchSpot(2)" title="西貢大浪灣"></span>
        </div>

        <button onclick="toggleTheme()" title="反色模式切換" aria-label="反色切換" class="ink-b px-1.5 py-0.5 text-[11px] font-bold active:bg-black active:text-white cursor-pointer shrink-0"><i class="fa-solid fa-circle-half-stroke"></i></button>
        <button onclick="fetchAllData()" title="手動刷新數據" aria-label="更新數據" class="ink-b px-1.5 py-0.5 text-[11px] font-bold active:bg-black active:text-white cursor-pointer shrink-0"><i id="syncIcon" class="fa-solid fa-rotate"></i></button>
      </div>
      <!-- HKO 實時特別警告標籤 -->
      <div id="warnBadge" class="bg-black text-white text-[10px] px-2 py-0.5 font-bold inline-flex items-center gap-1.5 max-w-[230px] truncate">
        <i class="fa-solid fa-shield-halved text-[9px] shrink-0"></i>
        <span id="warnText" class="truncate">天文台信號解除 (正常)</span>
      </div>
    </div>
    
    <!-- 右側日期與 12 小時制 AM/PM 大時鐘 (純時與分) -->
    <div class="text-right leading-none flex flex-col justify-center items-end shrink-0 pl-1">
      <div class="flex items-baseline justify-end gap-1">
        <span id="ampm" class="font-mono text-xs sm:text-sm font-black tracking-tight">AM</span>
        <span id="clock" class="font-mono text-4xl sm:text-5xl font-black tracking-tighter leading-none">--:--</span>
      </div>
      <div class="text-[11px] font-bold mt-1 tracking-tight whitespace-nowrap">
        <span id="date">----/--/--</span>
        <span id="wkday" class="ml-1.5 border-b-2 border-black font-black">星期-</span>
      </div>
    </div>
  </header>

  <!-- 2. 香港天文台實時氣候速報 (單列 5 欄：氣溫、天氣、濕度、UV、潮汐) -->
  <section class="ink-b grid grid-cols-5 text-center items-center py-1.5 bg-white shrink-0">
    <div class="ink-b-r px-0.5 min-w-0"><p class="text-[9px] font-bold uppercase opacity-80">氣溫</p><p class="font-mono text-base font-black leading-none mt-1"><span id="temp">28</span>°</p></div>
    <div class="ink-b-r px-0.5 min-w-0"><p class="text-[9px] font-bold uppercase opacity-80">天氣</p><p id="cond" class="text-[10px] font-black leading-tight mt-1 truncate">大致天晴</p></div>
    <div class="ink-b-r px-0.5 min-w-0"><p class="text-[9px] font-bold uppercase opacity-80">濕度</p><p id="humi" class="font-mono text-xs font-bold mt-1">78%</p></div>
    <div class="ink-b-r px-0.5 min-w-0"><p class="text-[9px] font-bold uppercase opacity-80">UV</p><p id="uv" class="font-mono text-xs font-bold mt-1">6</p></div>
    <div class="px-0.5 min-w-0">
      <p class="text-[9px] font-bold uppercase opacity-80">潮汐</p>
      <p id="tideTimes" class="font-mono text-[8px] sm:text-[9px] font-black leading-tight mt-0.5 tracking-tighter">
        <span class="block truncate">▲--:--</span>
        <span class="block truncate">▼--:--</span>
      </p>
    </div>
  </section>

  <!-- 3. 即時第一湧浪核心卡片 (下長沙 / 港島大浪灣 / 西貢大浪灣) -->
  <section class="p-2 bg-white shrink-0">
    <div class="grid grid-cols-12 items-center gap-2">
      <!-- 左側：湧浪數值區 -->
      <div class="col-span-7 pl-1 flex flex-col justify-between h-full min-w-0">
        <div>
          <div id="spotTitle" class="text-[10px] sm:text-xs font-black uppercase tracking-wider border-b border-black inline-block mb-1 truncate max-w-full">
            下長沙即時第一湧浪
          </div>
        </div>
        <div class="flex items-baseline gap-1 my-auto flex-wrap">
          <span id="cs_now" class="font-mono text-5xl sm:text-6xl font-black leading-none tracking-tighter">0.8</span>
          <span class="text-base font-black">m</span>
          <span id="cs_now_ft" class="text-[10px] font-mono font-bold opacity-75 ml-0.5 whitespace-nowrap">(2.6呎)</span>
        </div>
      </div>
      
      <!-- 右側：指標列表 (週期、浪向、總浪嚴格網格對齊) -->
      <div class="col-span-5 pl-2 border-l-2 border-black grid grid-rows-3 gap-y-1 h-full py-0.5 min-w-0">
        <div class="grid grid-cols-[38px_1fr] items-center gap-x-1 min-w-0">
          <span class="text-[9px] font-black bg-black text-white py-0.5 text-center shrink-0 leading-tight">週期</span>
          <span id="cs_pd" class="font-mono text-base font-black text-right leading-none truncate">7s</span>
        </div>
        <div class="grid grid-cols-[38px_1fr] items-center gap-x-1 min-w-0">
          <span class="text-[9px] font-black bg-black text-white py-0.5 text-center shrink-0 leading-tight">浪向</span>
          <span id="cs_dr" class="font-bold text-[11px] sm:text-xs text-right leading-none truncate">南 (S)</span>
        </div>
        <div class="grid grid-cols-[38px_1fr] items-center gap-x-1 min-w-0">
          <span class="text-[9px] font-black bg-black text-white py-0.5 text-center shrink-0 leading-tight">總浪</span>
          <span id="cs_total" class="font-mono text-xs font-bold text-right leading-none truncate">1.0m</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. 重點核心：未來 5 天第一湧浪深度趨勢統計 (抗變形彈性網格) -->
  <section class="flex flex-col justify-center min-h-0 py-0.5 shrink-0">
    <div class="flex justify-between items-center border-b-2 border-black pb-0.5 mb-1 shrink-0">
      <span class="text-[10px] font-black tracking-wider flex items-center gap-1">
        <i class="fa-solid fa-chart-simple text-[9px]"></i> <span id="statsTitle">未來 5 天第一湧浪深度趨勢統計</span>
      </span>
      <span class="text-[8px] font-bold opacity-75 inline-flex items-center gap-0.5 whitespace-nowrap">
        ≥1.5m 滿浪圖 <i class="fa-solid fa-water text-[8px]"></i>
      </span>
    </div>
    
    <!-- 5 天統計卡片網格 -->
    <div class="stats-grid" id="cs_stats">
      <div class="col-span-5 text-center text-xs py-3 font-mono font-bold">載入 5 天湧浪深度數據中...</div>
    </div>
  </section>

  <!-- 5. 香港天文台未來 5 天極簡微型預報條 -->
  <section class="shrink-0">
    <div class="flex justify-between items-center mb-1">
      <span class="text-[9px] font-black opacity-80 tracking-wider">HKO 5-DAY FORECAST (天文台五日預測)</span>
    </div>
    <div class="f-mini-grid" id="f_mini">
      <!-- 由 JavaScript 動態生成 5 格微縮預報 -->
    </div>
  </section>

  <!-- 6. 熱點名稱、定位座標與更新時間戳 -->
  <footer class="flex justify-between items-center text-[8px] sm:text-[9px] font-mono px-0.5 shrink-0 opacity-80 border-t border-black pt-1 pb-0.5">
    <span class="truncate max-w-[65%]" id="footerSpotDesc">熱點: 下長沙 (22.2312°N, 113.9472°E)</span>
    <span id="lastUpdated" class="shrink-0 ml-1">UPDATED: --:--:--</span>
  </footer>

</div>

<script>
  // 0. 香港三大衝浪熱點經緯度與配置
  const SURF_SPOTS = [
    {
      id: 'cheung_sha',
      name: '下長沙',
      badge: '下長沙 SURF',
      lat: 22.2312,
      lon: 113.9472,
      tideStation: '石壁 / 芝麻灣',
      tideOffsetHours: 0
    },
    {
      id: 'hk_big_wave_bay',
      name: '港島大浪灣',
      badge: '港島大浪灣 SURF',
      lat: 22.2472,
      lon: 114.2492,
      tideStation: '橫瀾島 / 鰂魚涌',
      tideOffsetHours: -0.5
    },
    {
      id: 'sk_tai_long_wan',
      name: '西貢大浪灣',
      badge: '西貢大浪灣 SURF',
      lat: 22.4005,
      lon: 114.3752,
      tideStation: '塔門 / 橫瀾島',
      tideOffsetHours: -0.8
    }
  ];

  let currentSpotIdx = 0;

  // 切換指定熱點
  function switchSpot(index) {
    if (index < 0) index = SURF_SPOTS.length - 1;
    if (index >= SURF_SPOTS.length) index = 0;
    currentSpotIdx = index;
    updateSpotUI();
    loadSwellStats();
    loadTideTimes();
  }

  function nextSpot() { switchSpot(currentSpotIdx + 1); }
  function prevSpot() { switchSpot(currentSpotIdx - 1); }

  // 更新熱點介面文字
  function updateSpotUI() {
    const spot = SURF_SPOTS[currentSpotIdx];
    document.getElementById('spotTitle').innerText = `${spot.name}即時第一湧浪`;
    document.getElementById('footerSpotDesc').innerText = `熱點: ${spot.name} (${spot.lat}°N, ${spot.lon}°E)`;

    // 更新指示點狀態
    const dots = document.querySelectorAll('.spot-dot');
    dots.forEach((dot, idx) => {
      if (idx === currentSpotIdx) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    });
  }

  // 支援觸控手勢滑動切換 (Swipe Gestures)
  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;

  const mainContainer = document.getElementById('mainContainer');

  mainContainer.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
    touchStartTime = Date.now();
  }, { passive: true });

  mainContainer.addEventListener('touchend', (e) => {
    const endX = e.changedTouches[0].screenX;
    const endY = e.changedTouches[0].screenY;
    const diffX = endX - touchStartX;
    const diffY = endY - touchStartY;
    const duration = Date.now() - touchStartTime;

    // 水平滑動門檻值 (防止垂直輕微抖動誤觸)
    if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY) * 1.3 && duration < 600) {
      if (diffX > 0) {
        nextSpot();
      } else {
        prevSpot();
      }
    }
  }, { passive: true });

  // 鍵盤方向鍵支援
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSpot();
    if (e.key === 'ArrowLeft') prevSpot();
  });

  // 1. 時鐘系統 (12 小時 AM/PM 制，僅顯示時與分)
  function runClock() {
    const now = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    let hours = now.getHours();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    document.getElementById('ampm').innerText = ampm;
    document.getElementById('clock').innerText = `${pad(hours)}:${pad(now.getMinutes())}`;
    document.getElementById('date').innerText = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())}`;
    document.getElementById('wkday').innerText = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][now.getDay()];
  }
  setInterval(runClock, 1000);
  runClock();

  // 反色模式切換
  function toggleTheme() {
    document.body.classList.toggle('inverted');
  }

  // 2. 串接香港天文台即時天氣與特別警報
  async function loadHKO() {
    try {
      const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
      if (res.ok) {
        const data = await res.json();
        const hko = data.temperature?.data?.find(t => t.place === '香港天文台') || data.temperature?.data?.[0];
        if (hko && hko.value !== undefined) {
          document.getElementById('temp').innerText = hko.value;
        }
        if (data.humidity?.data?.[0] && data.humidity.data[0].value !== undefined) {
          document.getElementById('humi').innerText = data.humidity.data[0].value + '%';
        }
        if (data.uvindex?.data?.[0] && data.uvindex.data[0].value !== undefined) {
          document.getElementById('uv').innerText = data.uvindex.data[0].value;
        } else {
          document.getElementById('uv').innerText = '0';
        }
        const isRain = data.rainfall?.data?.some(r => r.max > 0);
        document.getElementById('cond').innerText = isRain ? '有微雨' : '大致天晴';
      }
    } catch (e) {
      console.warn('HKO weather API fallback:', e);
    }

    try {
      const wRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
      if (wRes.ok) {
        const wData = await wRes.json();
        const keys = Object.keys(wData);
        if (keys.length > 0) {
          const WARN_NAMES = {
            'TC1': '一號熱帶氣旋',
            'TC3': '三號熱帶氣旋',
            'TC8NE': '八號東北烈風',
            'TC8SE': '八號東南烈風',
            'TC8NW': '八號西北烈風',
            'TC8SW': '八號西南烈風',
            'TC8': '八號烈風暴風',
            'TC9': '九號風力增強',
            'TC10': '十號颶風信號',
            'WRAINA': '黃色暴雨警告',
            'WRAINR': '紅色暴雨警告',
            'WRAINB': '黑色暴雨警告',
            'WTS': '雷暴警告',
            'WMS': '強烈季候風信號',
            'WFIREY': '黃色火災危險',
            'WFIRER': '紅色火災危險',
            'WHOT': '酷熱天氣警告',
            'WCOLD': '寒冷天氣警告',
            'WL': '山泥傾瀉警告',
            'WFNL': '新界北部水浸',
            'WFROST': '霜凍警告',
            'WTMW': '海嘯警告'
          };

          const priority = ['WTCSGNL', 'WRAIN', 'WTS', 'WTMW', 'WL', 'WMS', 'WHOT', 'WCOLD', 'WFIRE', 'WFROST'];
          keys.sort((a, b) => {
            const idxA = priority.indexOf(a) === -1 ? 99 : priority.indexOf(a);
            const idxB = priority.indexOf(b) === -1 ? 99 : priority.indexOf(b);
            return idxA - idxB;
          });

          const hasThunderstorm = keys.some(k => k === 'WTS' || wData[k]?.code === 'WTS');

          const otherWarnings = keys
            .filter(k => k !== 'WTS' && wData[k]?.code !== 'WTS')
            .map(k => {
              const item = wData[k];
              const code = item.code || '';
              return WARN_NAMES[code] || item.type || item.name || '特別天氣警告';
            });

          const warnEl = document.getElementById('warnText');
          const boltIcon = '<i class="fa-solid fa-bolt text-[10px] text-white"></i>';

          if (otherWarnings.length > 0) {
            const textPart = otherWarnings.slice(0, 2).join(' · ');
            warnEl.innerHTML = hasThunderstorm ? `${textPart} ${boltIcon}` : textPart;
          } else if (hasThunderstorm) {
            warnEl.innerHTML = `${boltIcon} 雷暴生效`;
          } else {
            warnEl.innerText = '天文台信號解除 (正常)';
          }
        } else {
          document.getElementById('warnText').innerText = '天文台信號解除 (正常)';
        }
      }
    } catch (e) {
      document.getElementById('warnText').innerText = '天文台信號解除 (正常)';
    }
  }

  // 3. 取得天文台 5 天極簡預報
  async function loadForecast() {
    const container = document.getElementById('f_mini');
    try {
      const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
      if (res.ok) {
        const data = await res.json();
        if (data.weatherForecast && data.weatherForecast.length > 0) {
          container.innerHTML = '';
          data.weatherForecast.slice(0, 5).forEach((f, i) => {
            const isToday = i === 0;
            const wk = isToday ? '今' : f.week.replace('星期', '');
            const wDesc = f.forecastWeather || '';
            let weather = '晴';
            if (wDesc.includes('雷')) weather = '雷';
            else if (wDesc.includes('雨')) weather = '雨';
            else if (wDesc.includes('陰') || wDesc.includes('雲')) weather = '雲';

            container.innerHTML += `
              <div class="f-mini-cell ${isToday ? 'active-f' : 'bg-white'}">
                <div class="text-[9px] font-bold">${wk}</div>
                <div class="font-black my-0.5 text-[10px]">${weather}</div>
                <div class="font-mono text-[8px] tracking-tighter truncate">${f.forecastMintemp.value}-${f.forecastMaxtemp.value}°</div>
              </div>`;
          });
          return;
        }
      }
    } catch (e) {
      console.warn('Forecast fallback:', e);
    }
    renderFallbackForecast();
  }

  function renderFallbackForecast() {
    const container = document.getElementById('f_mini');
    container.innerHTML = '';
    const days = ['今', '明', 'D3', 'D4', 'D5'];
    days.forEach((d, i) => {
      container.innerHTML += `
        <div class="f-mini-cell ${i === 0 ? 'active-f' : 'bg-white'}">
          <div class="text-[9px] font-bold">${d}</div>
          <div class="font-black my-0.5 text-[10px]">晴</div>
          <div class="font-mono text-[8px] tracking-tighter truncate">26-31°</div>
        </div>`;
    });
  }

  // 3.5 計算當前浪點水域全日天文潮汐
  function loadTideTimes() {
    const now = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    const spot = SURF_SPOTS[currentSpotIdx];
    
    const refNewMoon = new Date('2024-01-11T11:57:00Z');
    const diffDays = (now - refNewMoon) / (1000 * 60 * 60 * 24);
    const moonAge = (diffDays % 29.53058867 + 29.53058867) % 29.53058867;
    
    const period = 12.4206;
    const baseHigh = ((moonAge * 0.84 + 8.6 + spot.tideOffsetHours) % period + period) % period;
    
    const highCandidates = [baseHigh - period, baseHigh, baseHigh + period, baseHigh + period * 2];
    const highTides = highCandidates.filter(t => t >= 0 && t < 24).sort((a, b) => a - b);
    
    const baseLow = baseHigh + (period / 2);
    const lowCandidates = [baseLow - period * 2, baseLow - period, baseLow, baseLow + period, baseLow + period * 2];
    const lowTides = lowCandidates.filter(t => t >= 0 && t < 24).sort((a, b) => a - b);
    
    const formatTime = (hFloat) => {
      const h = Math.floor(hFloat);
      const m = Math.floor((hFloat % 1) * 60);
      return `${pad(h % 24)}:${pad(m % 60)}`;
    };
    
    const highStr = highTides.map(formatTime).join(' ');
    const lowStr = lowTides.map(formatTime).join(' ');
    
    const tideEl = document.getElementById('tideTimes');
    if (tideEl) {
      tideEl.innerHTML = `<span class="block truncate">▲${highStr || '--:--'}</span><span class="block truncate">▼${lowStr || '--:--'}</span>`;
      tideEl.title = `今日天文潮位預測：漲潮 ${highTides.map(formatTime).join(', ')} | 退潮 ${lowTides.map(formatTime).join(', ')}`;
    }
  }

  // 4. 動態獲取當前選定浪點的 5 天第一湧浪深度數據
  async function loadSwellStats() {
    const spot = SURF_SPOTS[currentSpotIdx];
    const statsGrid = document.getElementById('cs_stats');
    
    try {
      const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lon}&current=wave_height,swell_wave_height,swell_wave_direction,swell_wave_period&hourly=wave_height,swell_wave_height,swell_wave_period&forecast_days=5&timezone=Asia%2FHong_Kong`;
      const res = await fetch(url);
      
      if (res.ok) {
        const data = await res.json();
        
        const curSwell = (typeof data.current?.swell_wave_height === 'number') ? data.current.swell_wave_height : 0.8;
        const curPeriod = (typeof data.current?.swell_wave_period === 'number') ? Math.round(data.current.swell_wave_period) : 7;
        const curDir = (typeof data.current?.swell_wave_direction === 'number') ? data.current.swell_wave_direction : 180;
        const curTotal = (typeof data.current?.wave_height === 'number') ? data.current.wave_height : 1.0;

        document.getElementById('cs_now').innerText = curSwell.toFixed(1);
        document.getElementById('cs_now_ft').innerText = `(${(curSwell * 3.28).toFixed(1)}呎)`;
        document.getElementById('cs_pd').innerText = curPeriod + 's';
        document.getElementById('cs_total').innerText = curTotal.toFixed(1) + 'm';
        
        const dirs = ['北 (N)', '東北 (NE)', '東 (E)', '東南 (SE)', '南 (S)', '西南 (SW)', '西 (W)', '西北 (NW)'];
        document.getElementById('cs_dr').innerText = dirs[Math.round(curDir / 45) % 8];

        statsGrid.innerHTML = '';
        const hourlySwell = data.hourly?.swell_wave_height || [];
        const hourlyPd = data.hourly?.swell_wave_period || [];
        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        const baseDate = new Date();

        for (let day = 0; day < 5; day++) {
          const targetDate = new Date(baseDate);
          targetDate.setDate(baseDate.getDate() + day);
          const m = targetDate.getMonth() + 1;
          const d = targetDate.getDate();
          const wk = weekDays[targetDate.getDay()];
          const dayPrefix = day === 0 ? '今' : (day === 1 ? '明' : `D${day + 1}`);

          const startIdx = day * 24;
          const endIdx = (day + 1) * 24;
          const dayHeights = hourlySwell.slice(startIdx, endIdx);
          const dayPds = hourlyPd.slice(startIdx, endIdx);

          let avg = '0.8', min = '0.6', max = '1.0', avgPd = 7;
          if (dayHeights.length > 0) {
            avg = (dayHeights.reduce((a, b) => a + b, 0) / dayHeights.length).toFixed(1);
            min = Math.min(...dayHeights).toFixed(1);
            max = Math.max(...dayHeights).toFixed(1);
          }
          if (dayPds.length > 0) {
            avgPd = Math.round(dayPds.reduce((a, b) => a + b, 0) / dayPds.length);
          }

          const isToday = (day === 0);
          const isFullSwell = parseFloat(avg) >= 1.5;
          const waveVisual = isFullSwell
            ? `<i class="fa-solid fa-water text-xs leading-none" title="滿格浪況 (≥1.5m)"></i>`
            : '';

          statsGrid.innerHTML += `
            <div class="stats-cell ${isToday ? 'active-day' : ''}">
              <div class="text-[9px] font-black tracking-tight leading-tight pt-0.5 truncate w-full">
                <div>${dayPrefix} ${m}/${d}</div>
                <div class="text-[8px] font-bold opacity-85">星期${wk}</div>
              </div>
              <div class="w-full flex items-center justify-center h-3 my-0.5">
                ${waveVisual}
              </div>
              <div class="font-mono text-xs sm:text-[13px] font-black leading-none">
                ${avg}<span class="text-[8px] font-normal">m</span>
              </div>
              <div class="text-[8px] font-mono opacity-80 leading-none mt-1 truncate">
                ${min}-${max}
              </div>
              <div class="text-[8px] font-bold border-t ${isToday ? 'border-white' : 'border-black'} border-dotted w-full pt-1 mt-1 leading-none truncate">
                ${avgPd}s
              </div>
            </div>`;
        }
        return;
      }
    } catch (e) {
      console.warn('Swell stats fallback for spot:', spot.name, e);
    }
    
    renderFallbackSwellStats();
  }

  function renderFallbackSwellStats() {
    const statsGrid = document.getElementById('cs_stats');
    statsGrid.innerHTML = '';
    
    const spot = SURF_SPOTS[currentSpotIdx];
    const isEastCoast = currentSpotIdx > 0;
    const baseAvg = isEastCoast ? '1.1' : '0.8';
    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    const baseDate = new Date();

    const fallbackData = [
      { avg: baseAvg, min: '0.6', max: '1.2', pd: 7, active: true },
      { avg: isEastCoast ? '1.5' : '1.0', min: '0.8', max: '1.6', pd: 8, active: false },
      { avg: isEastCoast ? '1.6' : '1.2', min: '1.0', max: '1.8', pd: 9, active: false },
      { avg: '0.7', min: '0.5', max: '0.9', pd: 6, active: false },
      { avg: '0.6', min: '0.4', max: '0.8', pd: 6, active: false }
    ];

    fallbackData.forEach((item, day) => {
      const targetDate = new Date(baseDate);
      targetDate.setDate(baseDate.getDate() + day);
      const m = targetDate.getMonth() + 1;
      const d = targetDate.getDate();
      const wk = weekDays[targetDate.getDay()];
      const dayPrefix = day === 0 ? '今' : (day === 1 ? '明' : `D${day + 1}`);

      const isFullSwell = parseFloat(item.avg) >= 1.5;
      const waveVisual = isFullSwell
        ? `<i class="fa-solid fa-water text-xs leading-none" title="滿格浪況 (≥1.5m)"></i>`
        : '';

      statsGrid.innerHTML += `
        <div class="stats-cell ${item.active ? 'active-day' : ''}">
          <div class="text-[9px] font-black tracking-tight leading-tight pt-0.5 truncate w-full">
            <div>${dayPrefix} ${m}/${d}</div>
            <div class="text-[8px] font-bold opacity-85">星期${wk}</div>
          </div>
          <div class="w-full flex items-center justify-center h-3 my-0.5">
            ${waveVisual}
          </div>
          <div class="font-mono text-xs sm:text-[13px] font-black leading-none">${item.avg}<span class="text-[8px] font-normal">m</span></div>
          <div class="text-[8px] font-mono opacity-80 leading-none mt-1 truncate">${item.min}-${item.max}</div>
          <div class="text-[8px] font-bold border-t ${item.active ? 'border-white' : 'border-black'} border-dotted w-full pt-1 mt-1 leading-none truncate">${item.pd}s</div>
        </div>`;
    });
  }

  // 5. 數據全面即時刷新
  async function fetchAllData() {
    const icon = document.getElementById('syncIcon');
    if (icon) icon.classList.add('fa-spin');
    
    await Promise.allSettled([
      loadHKO(),
      loadForecast(),
      loadSwellStats(),
      Promise.resolve(loadTideTimes())
    ]);
    
    const now = new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    const updateEl = document.getElementById('lastUpdated');
    if (updateEl) {
      updateEl.innerText = `UPDATED: ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    
    if (icon) setTimeout(() => icon.classList.remove('fa-spin'), 500);
  }

  // 6. 電子墨水屏防殘影：每 30 分鐘自動反色一次，隨後即時變回原色
  function triggerAutoInversion() {
    const wasInverted = document.body.classList.contains('inverted');
    
    if (!wasInverted) {
      document.body.classList.add('inverted');
    } else {
      document.body.classList.remove('inverted');
    }

    setTimeout(() => {
      if (!wasInverted) {
        document.body.classList.remove('inverted');
      } else {
        document.body.classList.add('inverted');
      }
    }, 1200);
  }

  // 頁面加載完成後立即執行初次獲取，並設定每 15 分鐘自動刷新
  window.addEventListener('DOMContentLoaded', () => {
    updateSpotUI();
    fetchAllData();
    setInterval(fetchAllData, 15 * 60 * 1000);
    setInterval(triggerAutoInversion, 30 * 60 * 1000);
  });
</script>
